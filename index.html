<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Depo İnceleme</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Depo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Düzen: tek kolon, sahada tek elle kullanım. Sistem yazı tipi (çevrimdışı çalışsın diye). */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#14202e; --muted:#5d6b7c; --line:#dde3ea;
  --accent:#1f4e79; --accent-fg:#ffffff; --accent-soft:#e3edf7;
  --yes:#1b7a43; --yes-soft:#dff3e6; --no:#b3261e; --no-soft:#fbe4e2; --warn:#a15c00; --warn-soft:#fdf0d8;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1620; --surface:#18222f; --fg:#e8eef5; --muted:#9aa9ba; --line:#2a3646;
  --accent:#7db4e6; --accent-fg:#0b1824; --accent-soft:#1f3248;
  --yes:#62d08c; --yes-soft:#16382a; --no:#ff8f86; --no-soft:#41201e; --warn:#f2b45a; --warn-soft:#3d2d12; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0 110px;overscroll-behavior-y:none}
.wrap{max-width:640px;margin-inline:auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:calc(12px + env(safe-area-inset-top,0px)) 8px;margin-inline:-16px;padding-inline:16px}
.top .wrap{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:10px;min-width:0}
.bar h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:40px;padding:0 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.primary{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;min-height:48px;padding:0 18px;font-weight:600}
.primary[disabled]{opacity:.55}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.chip b{font-family:var(--mono);font-weight:500;color:var(--fg);margin-left:4px}
.chip.done b{color:var(--yes)}
.net{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:600;white-space:nowrap}
.net.on{background:var(--yes-soft);color:var(--yes)}
section.sec{margin-top:14px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 118px)}
section.sec>h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 2px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.lab{flex:1 1 11rem;min-width:0}
.lab span{display:block}
.rule{font-size:12px;color:var(--muted)}
.rule.ok{color:var(--yes)} .rule.bad{color:var(--no)}
.yn{display:flex;gap:6px;flex:0 0 auto}
.yn button{min-width:76px;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-weight:600;color:var(--muted)}
.yn button[aria-pressed="true"].e{background:var(--yes-soft);border-color:var(--yes);color:var(--yes)}
.yn button[aria-pressed="true"].h{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.yn.sel button{min-width:68px;padding:0 10px}
.yn.sel button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.fld{display:flex;align-items:center;gap:6px;flex:0 1 11rem;min-width:0}
.fld input{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 10px}
.fld input.n{text-align:right;font-family:var(--mono)}
.fld .u{font-size:12px;color:var(--muted);white-space:nowrap}
textarea{width:100%;min-height:96px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;resize:vertical}
.row.col{display:block}
.row.col .lab{margin-bottom:6px}
.maplink{font-size:13px;color:var(--accent);font-weight:600;align-self:center}
.photos{padding:10px 12px;border-top:1px solid var(--line);background:var(--bg)}
.photos .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .tick{position:absolute;top:4px;right:4px;background:var(--yes);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px}
.thumb .acts{position:absolute;inset:auto 0 0 0;display:flex;background:rgba(0,0,0,.55)}
.thumb .acts button{flex:1;border:0;background:none;color:#fff;font-size:12px;min-height:30px}
.vh{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--muted)}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:600;white-space:nowrap}
.badge.ok{background:var(--yes-soft);color:var(--yes)}
.pct{font-family:var(--mono);font-size:13px;color:var(--accent)}
.empty{margin-top:28px;padding:28px 18px;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.dock{position:fixed;inset:auto 0 0 0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
.dock .wrap{display:flex;gap:8px}
.dock .primary{flex:1}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;z-index:9;max-width:90vw;text-align:center}
.save{font-size:12px;color:var(--muted);font-family:var(--mono)}
.danger{color:var(--no)}
.sp{display:flex;gap:8px;margin-top:8px}
.sp input,.set input{flex:1;min-width:0;width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 10px}
.set label{display:block;font-weight:600;margin-top:12px}
.set .rule{margin-top:2px}
.pad{padding:12px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="bar">
    <button class="iconbtn" id="back" hidden aria-label="Listeye dön">‹ Liste</button>
    <h1 id="title">Depo İnceleme</h1>
    <span class="save" id="saved"></span>
    <span class="net" id="net">…</span>
    <button class="iconbtn" id="gear" aria-label="Ayarlar">⚙</button>
  </div>
  <div class="prog" id="progwrap" hidden><i id="prog"></i></div>
  <div class="chips" id="chips" hidden></div>
</div></div>

<main class="wrap" id="main"></main>
<div class="dock" id="dock"><div class="wrap" id="dockin"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="xlsx.min.js"></script>
<script>
/* ---------- Kriter şeması (Depo İnceleme Kriterleri.xlsx > Detaylar) ---------- */
const Y='yn',N='num',T='text',A='area',S='sel';
const KAPLAMA=['Taş yünü','PIR','PUR'];
const SECTIONS=[
 {id:'genel',title:'Genel bilgi',x:null,f:[
  {k:'ad',x:'DEPO İSMİ',t:T},{k:'iletisim',x:'İletişim',t:T},{k:'konum',x:'Location',l:'Konum (harita linki)',t:T,link:1},
  {k:'kira',x:'Rental Price',l:'Kira bedeli',t:N,u:'USD/m²'},{k:'opHazir',x:'Operasyon Hazır',t:Y}]},
 {id:'durum',title:'Genel durum',x:'GENEL DURUM',f:[
  {k:'oturum',x:'Depo oturumu',t:N,u:'m²'},{k:'munferit',x:'Her kata münferit giriş',t:Y},
  {k:'ruhsat',x:'İnşaat Ruhsatı alınmış',t:Y},{k:'insaat',x:'İnşaat devam ediyor',t:Y},{k:'iskan',x:'İskan alınmış',t:Y},
  {k:'ulasim',x:'Ulaşım Yolları',t:T}]},
 {id:'alan',title:'Alan ve yükseklik',x:'DEPO ALAN VE YÜKSEKLİKLER',f:[
  {k:'kapali',x:'Toplam Kapalı Alan',t:N,u:'m²'},{k:'parsel',x:'Parsel Alanı',t:N,u:'m²'},
  {k:'zemin',x:'Zemin Kat',t:N,u:'m²'},{k:'bodrum',x:'Bodrum Kat',t:N,u:'m²'},{k:'dis',x:'Dış Alan',t:N,u:'m²'},
  {k:'hz',x:'Zemin Yükseklik >12 m',l:'Zemin yükseklik',t:N,u:'m',min:12},
  {k:'hb',x:'Bodrum Yükseklik > 10 m',l:'Bodrum yükseklik',t:N,u:'m',min:10},
  {k:'ha',x:'Asma Kat Yükseklik',t:N,u:'m'},
  {k:'yuk',x:'Zemin Döşeme Taşıma Yükü Ton/m2 > 2,5 ton',l:'Zemin döşeme taşıma yükü',t:N,u:'t/m²',min:2.5},
  {k:'aks',x:'Aks aralıkları uygun',t:Y}]},
 {id:'yukleme',title:'Yükleme alanı',x:'YÜKLEME ALANI',f:[
  {k:'manevra',x:'Manevra alanı > 35 m',l:'Manevra alanı',t:N,u:'m',min:35},
  {k:'rampa',x:'Rampalar (1/1000 m2)',l:'Rampa sayısı',t:N,u:'adet'},
  {k:'giris',x:'Depo araç giriş rampası',t:Y},{k:'saha',x:'Dış saha kaplaması uygun',t:Y}]},
 {id:'cephe',title:'Cephe ve çatı',x:'CEPHE ve ÇATI',f:[
  {k:'cephe',x:'Cephe Kaplaması',t:S},{k:'cati',x:'Çatı Kaplaması',t:S},
  {k:'isiklik',x:'Işıklık >%8',l:'Işıklık oranı',t:N,u:'%',min:8},
  {k:'gun',x:'Gün ışığı mevcut',t:Y},{k:'duman',x:'Çatı Duman rezervasyonu',t:Y},{k:'sifonik',x:'Sifonik sistem mevcut',t:Y}]},
 {id:'yangin',title:'Yangın',x:'YANGIN',f:[
  {k:'algi',x:'Yangın algılama mevcut',t:Y},{k:'sprk',x:'Sprinkler mevcut',t:Y},{k:'hidrant',x:'Dış Hidrant mevcut',t:Y},
  {k:'sutank',x:'Su Deposu mevcut',t:Y},{k:'pdizel',x:'Yangın pompası dizel',t:Y},{k:'pelek',x:'Yangın pompası elektrikli',t:Y}]},
 {id:'elektrik',title:'Elektrik',x:'ELEKTRİK',f:[
  {k:'trafo',x:'Trafo mevcut',t:Y},{k:'pano',x:'Dağıtım panosu mevcut',t:Y},{k:'solar',x:'Solar Sistem mevcut',t:Y},
  {k:'led',x:'Aydınlatma LED mevcut',t:Y},{k:'disay',x:'Dış aydınlatma mevcut',t:Y},{k:'aku',x:'Akü şarj odası mevcut',t:Y},
  {k:'jen',x:'Jeneratör mevcut',t:Y},{k:'ofispano',x:'Ofis pano mevcut',t:Y}]},
 {id:'guvenlik',title:'Güvenlik',x:'GÜVENLİK',f:[
  {k:'duvar',x:'Depo etrafı duvar mevcut',t:Y},{k:'kamera',x:'Kamera sistemi mevcut',t:Y},{k:'anons',x:'Anons sistemi mevcut',t:Y},
  {k:'kulube',x:'Güvenlik Kulübesi mevcut',t:Y},{k:'bariyer',x:'Saha  giriş bariyeri mevcut',l:'Saha giriş bariyeri mevcut',t:Y},
  {k:'yaya',x:'Yaya yolları mevcut',t:Y},{k:'sofor',x:'Şöfor bekleme od. mevcut',l:'Şoför bekleme odası mevcut',t:Y}]},
 {id:'yorum',title:'Yorumlar',x:'YORUMLAR',f:[
  {k:'avantaj',x:'Avantajlar',t:A},{k:'dezavantaj',x:'Dezavantajlar',t:A}]}
];
const COUNTED=SECTIONS.flatMap(s=>s.f).filter(f=>f.t!==A);

/* ---------- Yerel depo (IndexedDB): kayıtlar, fotoğraf dosyaları, ayarlar ---------- */
let _db=null;
function idb(){
  if(_db)return _db;
  _db=new Promise((res,rej)=>{
    const r=indexedDB.open('depo-inceleme',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('rec',{keyPath:'id'});d.createObjectStore('photo',{keyPath:'id'});d.createObjectStore('kv')};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  return _db;
}
async function store(name,mode,fn){
  const d=await idb();
  return new Promise((res,rej)=>{
    const t=d.transaction(name,mode),s=t.objectStore(name);let req=fn(s);
    t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  });
}
const dbPut=(n,v,k)=>store(n,'readwrite',s=>k===undefined?s.put(v):s.put(v,k));
const dbGet=(n,k)=>store(n,'readonly',s=>s.get(k));
const dbAll=n=>store(n,'readonly',s=>s.getAll());
const dbDel=(n,k)=>store(n,'readwrite',s=>s.delete(k));

/* ---------- Durum ---------- */
let records=new Map(), cur=null, view='list', cfg={flow:'',sp:''};
let saveTimer=null, chain=Promise.resolve(), urls=new Map(), installEvt=null, sending=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,ms=2800){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms)}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const fmtDate=ts=>new Date(ts).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'});
const slug=s=>String(s||'depo').normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/ı/g,'i').replace(/İ/g,'I').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')||'depo';
function norm(r){r.v=r.v||{};r.photos=r.photos||[];return r}
function answered(rec){return COUNTED.filter(f=>{const v=rec.v[f.k];return v!==undefined&&v!==''&&v!==null}).length}
const pct=rec=>Math.round(answered(rec)/COUNTED.length*100);
const pending=rec=>(rec.photos||[]).filter(p=>!p.sent).length;

function persist(rec){
  rec.updatedAt=Date.now();
  chain=chain.then(async()=>{
    try{await dbPut('rec',rec);$('saved').textContent='Kaydedildi'}
    catch(e){$('saved').textContent='Kaydedilemedi';toast('Kayıt başarısız. Telefonun depolama alanını kontrol edin.')}
  });
  return chain;
}
function touch(){cur.dirty=true;$('saved').textContent='…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>persist(cur),500)}
async function flush(){clearTimeout(saveTimer);if(cur&&$('saved').textContent==='…')persist(cur);await chain}

/* ---------- Liste ---------- */
function renderList(){
  view='list';cur=null;revokeUrls();
  $('title').textContent='Depo İnceleme';
  $('back').hidden=true;$('chips').hidden=true;$('progwrap').hidden=true;$('saved').textContent='';
  const items=[...records.values()].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  let h='';
  if(!items.length)h=`<div class="empty"><b>Henüz inceleme yok</b>Sahada ilk depoyu başlatmak için aşağıdaki düğmeye basın. Her şey telefonda saklanır, internet gerekmez.</div>`;
  else h='<div class="list">'+items.map(r=>{
    const pe=pending(r),sent=r.sentAt&&!r.dirty&&!pe;
    return `<button class="item" data-open="${r.id}"><div class="t"><b>${esc(r.v.ad||'Adsız depo')}</b><small>${fmtDate(r.createdAt)} · ${r.photos.length} fotoğraf</small></div><span class="badge ${sent?'ok':''}">${sent?'Gönderildi':'Gönderilmedi'}</span><span class="pct">%${pct(r)}</span></button>`}).join('')+'</div>';
  $('main').innerHTML=h;
  $('dockin').innerHTML=`<button class="primary" id="new">+ Yeni inceleme</button>`+(items.length?`<button class="iconbtn" id="expall">Tümünü Excel'e aktar</button>`:'');
  window.scrollTo(0,0);
}

/* ---------- Ayarlar ---------- */
function renderSettings(){
  view='settings';cur=null;revokeUrls();
  $('title').textContent='Ayarlar';$('back').hidden=false;$('chips').hidden=true;$('progwrap').hidden=true;$('saved').textContent='';
  $('main').innerHTML=`<div class="card set pad">
   <label for="flow">Power Automate akış adresi</label>
   <span class="rule">"Bir HTTP isteği alındığında" adımındaki adres. Yalnızca bu telefonda saklanır. Kimseyle paylaşmayın.</span>
   <input id="flow" type="url" inputmode="url" autocomplete="off" placeholder="https://prod-00.westeurope.logic.azure.com/…" value="${esc(cfg.flow)}">
   <label for="spf">SharePoint fotoğraf klasörü (isteğe bağlı)</label>
   <span class="rule">Formdan tek dokunuşla açmak için klasör linki.</span>
   <input id="spf" type="url" inputmode="url" autocomplete="off" placeholder="https://…sharepoint.com/…" value="${esc(cfg.sp)}">
   <div class="sp"><button class="primary" id="cfgsave" style="flex:1">Kaydet</button><button class="iconbtn" id="cfgtest">Bağlantıyı dene</button></div>
   <p class="hint" id="cfgmsg"></p>
  </div>
  <div class="card pad" style="margin-top:14px"><b>Uygulamayı telefona yükle</b>
   <p class="hint" style="margin-top:4px">Android Chrome: menüden "Uygulamayı yükle". iPhone Safari: Paylaş simgesi, sonra "Ana Ekrana Ekle".</p>
   ${installEvt?'<button class="iconbtn" id="install" style="margin-top:8px">Uygulamayı yükle</button>':''}
  </div>`;
  $('dockin').innerHTML=`<button class="iconbtn" id="done" style="flex:1">Kapat</button>`;
  window.scrollTo(0,0);
}

/* ---------- Form ---------- */
function ruleHtml(f,v){
  if(f.min===undefined)return '';
  if(v===undefined||v===''||v===null)return `<span class="rule" data-rule="${f.k}">Hedef: en az ${f.min} ${f.u}</span>`;
  const ok=Number(String(v).replace(',','.'))>=f.min;
  return `<span class="rule ${ok?'ok':'bad'}" data-rule="${f.k}">${ok?'✓ Hedefi karşılıyor':'✗ Hedefin altında'} (en az ${f.min} ${f.u})</span>`;
}
function fieldHtml(f,rec){
  const v=rec.v[f.k], lab=esc(f.l||f.x);
  if(f.t===Y)return `<div class="row"><div class="lab"><span>${lab}</span></div><div class="yn" data-yn="${f.k}"><button class="e" aria-pressed="${v==='Evet'}" data-v="Evet">Evet</button><button class="h" aria-pressed="${v==='Hayır'}" data-v="Hayır">Hayır</button></div></div>`;
  if(f.t===S)return `<div class="row"><div class="lab"><span>${lab}</span></div><div class="yn sel" data-yn="${f.k}">${KAPLAMA.map(o=>`<button aria-pressed="${v===o}" data-v="${o}">${o}</button>`).join('')}</div></div>`;
  if(f.t===N)return `<div class="row"><div class="lab"><span>${lab}</span>${ruleHtml(f,v)}</div><label class="fld"><input class="n" id="f_${f.k}" data-k="${f.k}" inputmode="decimal" autocomplete="off" value="${esc(v)}" placeholder="0"><span class="u">${esc(f.u)}</span></label></div>`;
  if(f.t===A)return `<div class="row col"><div class="lab"><span>${lab}</span></div><textarea id="f_${f.k}" data-k="${f.k}">${esc(v)}</textarea></div>`;
  const link=f.link&&/^https?:\/\//i.test(v||'')?`<a class="maplink" href="${esc(v)}" target="_blank" rel="noopener">Haritada aç</a>`:'';
  return `<div class="row"><div class="lab"><span>${lab}</span></div><label class="fld"><input id="f_${f.k}" data-k="${f.k}" autocomplete="off" value="${esc(v)}" ${f.link?'inputmode="url"':''}>${link}</label></div>`;
}
function photosHtml(s,rec){
  const list=rec.photos.filter(p=>p.sec===s.id);
  return `<div class="photos"><div class="head"><b style="font-size:13px">Fotoğraflar (${list.length})</b>
   <label class="iconbtn" style="cursor:pointer;position:relative">+ Fotoğraf<input class="vh" type="file" accept="image/*" capture="environment" multiple data-photo="${s.id}"></label></div>
   ${list.length?`<div class="thumbs">${list.map(p=>`<div class="thumb"><img data-pid="${p.id}" alt="${esc(p.n)}">${p.sent?'<span class="tick">✓</span>':''}<div class="acts"><button data-psave="${p.id}">İndir</button><button data-pdel="${p.id}">Sil</button></div></div>`).join('')}</div>`:''}</div>`;
}
function chipsHtml(rec){
  return SECTIONS.map(s=>{
    const fs=s.f.filter(f=>f.t!==A),n=fs.filter(f=>{const v=rec.v[f.k];return v!==undefined&&v!==''}).length;
    return `<button class="chip ${fs.length&&n===fs.length?'done':''}" data-go="${s.id}" data-chip="${s.id}">${esc(s.title)}${fs.length?`<b>${n}/${fs.length}</b>`:''}</button>`;
  }).join('');
}
function revokeUrls(){urls.forEach(u=>URL.revokeObjectURL(u));urls.clear()}
async function fillThumbs(){
  for(const img of document.querySelectorAll('img[data-pid]')){
    const id=img.dataset.pid;
    try{
      if(!urls.has(id)){const p=await dbGet('photo',id);if(!p)continue;urls.set(id,URL.createObjectURL(p.blob))}
      img.src=urls.get(id);
    }catch(e){}
  }
}
function renderForm(id){
  const rec=records.get(id);if(!rec)return renderList();
  cur=rec;view='form';norm(rec);
  $('back').hidden=false;$('chips').hidden=false;$('progwrap').hidden=false;
  $('title').textContent=rec.v.ad||'Yeni inceleme';
  $('chips').innerHTML=chipsHtml(rec);
  $('main').innerHTML=SECTIONS.map(s=>`<section class="sec" id="s_${s.id}"><h2>${esc(s.title)}</h2><div class="card">${s.f.map(f=>fieldHtml(f,rec)).join('')}${photosHtml(s,rec)}</div></section>`).join('')+
   `<div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap">${cfg.sp?`<a class="iconbtn" href="${esc(cfg.sp)}" target="_blank" rel="noopener">SharePoint klasörünü aç</a>`:''}<button class="iconbtn danger" id="del">Bu incelemeyi sil</button></div><p class="hint" id="delmsg"></p>`;
  $('dockin').innerHTML=`<button class="primary" id="send">SharePoint'e gönder</button><button class="iconbtn" id="exp">Excel indir</button><button class="iconbtn" id="done">Bitti</button>`;
  updateProg();fillThumbs();window.scrollTo(0,0);
}
function updateProg(){
  if(!cur)return;
  $('prog').style.width=pct(cur)+'%';
  SECTIONS.forEach(s=>{
    const el=document.querySelector(`[data-chip="${s.id}"]`);if(!el)return;
    const fs=s.f.filter(f=>f.t!==A);if(!fs.length)return;
    const n=fs.filter(f=>{const v=cur.v[f.k];return v!==undefined&&v!==''}).length;
    el.querySelector('b').textContent=n+'/'+fs.length;el.classList.toggle('done',n===fs.length);
  });
}
function rerenderKeepScroll(){const y=window.scrollY;renderForm(cur.id);window.scrollTo(0,y)}
function newRec(){
  const r={id:uid(),createdAt:Date.now(),updatedAt:Date.now(),v:{},photos:[],dirty:true};
  records.set(r.id,r);persist(r);renderForm(r.id);
  setTimeout(()=>$('f_ad')&&$('f_ad').focus(),60);
}

/* ---------- Fotoğraf ---------- */
function shrink(file,max=1600){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',0.82);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};img.src=u;
  });
}
async function addPhotos(secId,files){
  const rec=cur;if(!rec)return;
  const sec=SECTIONS.find(s=>s.id===secId);let ok=0;
  toast(files.length+' fotoğraf kaydediliyor…');
  for(const f of files){
    try{
      const blob=await shrink(f),id=uid();
      await dbPut('photo',{id,recId:rec.id,blob});
      const n=rec.photos.filter(p=>p.sec===secId).length+1;
      rec.photos.push({id,sec:secId,sent:false,n:`${slug(rec.v.ad)}_${slug(sec.title)}_${String(n).padStart(2,'0')}_${id.slice(0,4)}.jpg`});ok++;
    }catch(e){toast('Fotoğraf eklenemedi.')}
  }
  if(ok){rec.dirty=true;await persist(rec);if(cur===rec)rerenderKeepScroll();toast(ok+' fotoğraf eklendi')}
}
async function savePhoto(id){
  const p=await dbGet('photo',id),m=cur.photos.find(x=>x.id===id);if(!p||!m)return;
  const file=new File([p.blob],m.n,{type:'image/jpeg'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(p.blob);a.download=m.n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function delPhoto(id){
  cur.photos=cur.photos.filter(p=>p.id!==id);cur.dirty=true;
  try{await dbDel('photo',id)}catch(e){}
  persist(cur);rerenderKeepScroll();
}

/* ---------- Excel ---------- */
function buildRows(recs){
  const rows=[];
  SECTIONS.forEach(s=>{
    if(s.x)rows.push([s.x,...recs.map(()=>'')]);
    s.f.forEach(f=>rows.push([f.x,...recs.map(r=>{const v=r.v[f.k];if(v===undefined||v==='')return '';
      if(f.t===N){const n=Number(String(v).replace(',','.'));return isNaN(n)?v:n}return v})]));
  });
  rows.push(['Fotoğraf sayısı',...recs.map(r=>r.photos.length)]);
  return rows;
}
function xlsxBuffer(recs){
  const ws=XLSX.utils.aoa_to_sheet(buildRows(recs));
  ws['!cols']=[{wch:46},...recs.map(()=>({wch:24}))];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Detaylar');
  return XLSX.write(wb,{bookType:'xlsx',type:'array'});
}
function downloadBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function exportXlsx(recs,name){
  try{downloadBlob(new Blob([xlsxBuffer(recs)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name);toast('Excel hazır')}
  catch(e){toast('Excel oluşturulamadı.')}
}

/* ---------- SharePoint'e gönderim (Power Automate HTTP akışı) ---------- */
function blobB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
async function post(payload){
  /* text/plain: tarayıcı ön kontrol (preflight) yapmaz, Power Automate bu isteği kabul eder */
  const r=await fetch(cfg.flow,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r;
}
function sendError(e){
  if(e&&e.name==='TypeError')return navigator.onLine?'Gönderim doğrulanamadı. Akışın "Yanıt" adımında Access-Control-Allow-Origin başlığı olmalı (README).':'İnternet yok. Bağlantı gelince tekrar deneyin.';
  return 'Gönderilemedi ('+((e&&e.message)||'hata')+').';
}
async function sendRec(rec){
  if(sending)return;
  if(!cfg.flow){toast('Önce Ayarlar\'dan Power Automate adresini girin.');return}
  if(!navigator.onLine){toast('İnternet yok. Bağlantı gelince tekrar deneyin.');return}
  sending=true;const btn=$('send');if(btn)btn.disabled=true;
  try{
    const todo=rec.photos.filter(p=>!p.sent);let i=0;
    for(const m of todo){
      i++;toast(`Fotoğraf gönderiliyor ${i}/${todo.length}…`,6000);
      const p=await dbGet('photo',m.id);if(!p){m.sent=true;continue}
      await post({type:'photo',inspectionId:rec.id,depo:rec.v.ad||'',fileName:m.n,section:m.sec,contentBase64:await blobB64(p.blob)});
      m.sent=true;await persist(rec);
    }
    toast('Excel gönderiliyor…',6000);
    const d=new Date(),stamp=d.toISOString().slice(0,10)+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
    const fname=`Depo_Inceleme_${slug(rec.v.ad)}_${stamp}.xlsx`;
    await post({type:'xlsx',inspectionId:rec.id,depo:rec.v.ad||'',fileName:fname,contentBase64:await blobB64(new Blob([xlsxBuffer([rec])]))});
    rec.sentAt=Date.now();rec.dirty=false;await persist(rec);
    if(cur===rec)rerenderKeepScroll();
    toast('SharePoint\'e gönderildi ✓');
  }catch(e){toast(sendError(e),5000);if(cur===rec)rerenderKeepScroll()}
  finally{sending=false;const b=$('send');if(b)b.disabled=false}
}
async function testFlow(){
  const msg=$('cfgmsg');
  if(!cfg.flow){msg.textContent='Önce adresi girip kaydedin.';return}
  msg.textContent='Deneniyor…';
  try{await post({type:'ping',at:Date.now()});msg.textContent='Bağlantı çalışıyor ✓'}
  catch(e){msg.textContent=sendError(e)}
}

/* ---------- Olaylar ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='new')return newRec();
  if(t.dataset.open)return renderForm(t.dataset.open);
  if(t.id==='gear'){await flush();return renderSettings()}
  if(t.id==='back'||t.id==='done'){await flush();return renderList()}
  if(t.id==='cfgsave'){
    cfg.flow=$('flow').value.trim();cfg.sp=$('spf').value.trim();
    try{await dbPut('kv',cfg,'cfg');$('cfgmsg').textContent='Kaydedildi'}catch(x){$('cfgmsg').textContent='Kaydedilemedi'}return}
  if(t.id==='cfgtest'){cfg.flow=$('flow').value.trim();return testFlow()}
  if(t.id==='install'&&installEvt){installEvt.prompt();installEvt=null;return}
  if(t.id==='send'){await flush();return sendRec(cur)}
  if(t.id==='exp'){await flush();return exportXlsx([cur],slug(cur.v.ad)+'_Depo_Inceleme.xlsx')}
  if(t.id==='expall'){return exportXlsx([...records.values()].sort((a,b)=>a.createdAt-b.createdAt),'Depo_Inceleme_Karsilastirma_'+new Date().toISOString().slice(0,10)+'.xlsx')}
  if(t.dataset.go){const el=$('s_'+t.dataset.go);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.parentElement&&t.parentElement.dataset&&t.parentElement.dataset.yn&&cur){
    const k=t.parentElement.dataset.yn,val=t.dataset.v;
    cur.v[k]=cur.v[k]===val?'':val;
    [...t.parentElement.children].forEach(b=>b.setAttribute('aria-pressed',String(cur.v[k]===b.dataset.v)));
    updateProg();return touch();
  }
  if(t.dataset.psave)return savePhoto(t.dataset.psave);
  if(t.dataset.pdel)return delPhoto(t.dataset.pdel);
  if(t.id==='del'){
    if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Silmek için tekrar dokunun';return}
    const rec=cur;records.delete(rec.id);cur=null;
    try{await dbDel('rec',rec.id);for(const p of rec.photos)await dbDel('photo',p.id)}catch(x){}
    renderList();toast('İnceleme silindi');
  }
});
document.addEventListener('change',e=>{
  const i=e.target;if(i.dataset&&i.dataset.photo&&i.files.length){addPhotos(i.dataset.photo,[...i.files]);i.value=''}
});
document.addEventListener('input',e=>{
  const i=e.target;if(!cur||!i.dataset||!i.dataset.k)return;
  const k=i.dataset.k;cur.v[k]=i.value;
  const f=COUNTED.find(x=>x.k===k);
  if(f&&f.min!==undefined){const r=document.querySelector(`[data-rule="${k}"]`);if(r){const tmp=document.createElement('div');tmp.innerHTML=ruleHtml(f,i.value);r.replaceWith(tmp.firstChild)}}
  if(k==='ad')$('title').textContent=i.value||'Yeni inceleme';
  if(k==='konum'){const w=i.closest('.fld');let a=w.querySelector('.maplink');const ok=/^https?:\/\//i.test(i.value);
    if(ok&&!a){a=document.createElement('a');a.className='maplink';a.textContent='Haritada aç';a.target='_blank';a.rel='noopener';w.appendChild(a)}
    if(a){if(ok)a.href=i.value;else a.remove()}}
  updateProg();touch();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
window.addEventListener('pagehide',()=>{flush()});
function netState(){const n=$('net');n.textContent=navigator.onLine?'Çevrimiçi':'Çevrimdışı';n.classList.toggle('on',navigator.onLine)}
window.addEventListener('online',()=>{netState();if(cfg.flow&&view==='list'){const p=[...records.values()].reduce((a,r)=>a+pending(r),0);if(p)toast(p+' fotoğraf gönderilmeyi bekliyor. İncelemeyi açıp "SharePoint\'e gönder"e basın.',4500)}});
window.addEventListener('offline',netState);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});

/* ---------- Başlangıç ---------- */
async function boot(){
  netState();
  try{
    const c=await dbGet('kv','cfg');if(c)cfg=Object.assign(cfg,c);
    (await dbAll('rec')).forEach(r=>records.set(r.id,norm(r)));
  }catch(e){toast('Yerel depolama açılamadı. Özel gezinme kapalı olmalı.',6000)}
  renderList();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
</script>
