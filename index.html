<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Depo İnceleme</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Depo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Yumuşak pastel kartlar, büyük yuvarlak köşeler, siyah ana düğme. Sistem yazı tipi (çevrimdışı çalışsın diye). */
:root{
  --bg:#eef3f8; --surface:#ffffff; --fg:#14202e; --muted:#5d6b7c; --line:rgba(31,78,121,.12);
  --glass:rgba(244,248,252,.62); --glass-line:rgba(255,255,255,.7);
  --ink:#1f4e79; --ink-fg:#ffffff; --btn:#2e75b6; --btn-fg:#ffffff; --btn-soft:#c9dcf0; --btn-soft-fg:#1f4e79;
  --yes:#1b7a43; --yes-soft:#d9f0e1; --no:#b3261e; --no-soft:#fbe0dd; --warn:#8a5300; --warn-soft:#fbeccf;
  --p1:#d6e6f6; --p2:#e4eef8; --p3:#c9dcf0; --p4:#dde9f3; --p5:#d1e3f2;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1722; --surface:#172433; --fg:#e8eef5; --muted:#9aa9ba; --line:rgba(255,255,255,.1);
  --glass:rgba(18,30,44,.58); --glass-line:rgba(255,255,255,.14);
  --ink:#7db4e6; --ink-fg:#0b1824; --btn:#2f6ea8; --btn-fg:#ffffff; --btn-soft:#24476b; --btn-soft-fg:#d5e7fa;
  --yes:#62d08c; --yes-soft:#16382a; --no:#ff8f86; --no-soft:#41201e; --warn:#f2b45a; --warn-soft:#3d2d12;
  --p1:#1f3a56; --p2:#1a2f45; --p3:#25446a; --p4:#1d3550; --p5:#223f5e; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;padding-inline:18px;padding-block:0 130px;overscroll-behavior-y:none}
.wrap{max-width:640px;margin-inline:auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pc1{--pc:var(--p1)} .pc2{--pc:var(--p2)} .pc3{--pc:var(--p3)} .pc4{--pc:var(--p4)} .pc5{--pc:var(--p5)}

/* üst çubuk */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:calc(12px + env(safe-area-inset-top,0px)) 8px;margin-inline:-18px;padding-inline:18px}
.top .wrap{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:10px;min-width:0}
.bar h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.circle{width:44px;height:44px;border-radius:50%;border:0;background:var(--btn);color:var(--btn-fg);box-shadow:0 1px 2px var(--line);font-size:20px;font-weight:600;display:inline-grid;place-items:center;flex:0 0 auto;padding:0}
.av{background:var(--btn);color:var(--btn-fg);font-size:16px;font-weight:700}
.ring{flex:0 0 auto;color:var(--ink);display:grid;place-items:center}
.save{font-size:11px;color:var(--muted);font-family:var(--mono)}
.net{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:700;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--btn-soft);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;color:var(--btn-soft-fg);box-shadow:0 1px 2px var(--line)}
.chip.done::after{content:" ✓";color:var(--yes)}
.chip.on{background:var(--ink);color:var(--ink-fg)}
.chip.on.done::after{color:var(--ink-fg)}

/* ana sayfa */
.hello{margin-top:8px}
.hello h2{font-size:30px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.02em}
.hello p{margin:4px 0 0;color:var(--muted);font-size:14px}
.search{display:flex;gap:10px;align-items:center;margin-top:18px}
.search label{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:0 18px;min-height:52px;box-shadow:0 1px 2px var(--line)}
.search input{flex:1;min-width:0;width:100%;border:0;background:none;outline:none;min-height:50px}
.search label svg{color:var(--muted);flex:0 0 auto}
.blackbtn{width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;flex:0 0 auto}
.blackbtn[disabled]{opacity:.5}
h3.sh2{font-size:19px;font-weight:800;margin:26px 0 12px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline}
h3.sh2 small{font-size:13px;font-weight:600;color:var(--muted)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{position:relative;overflow:hidden;border:2px solid transparent;border-radius:26px;padding:16px;text-align:left;background:var(--pc);min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.cat[aria-pressed="true"]{border-color:var(--ink)}
.cat b{font-size:34px;line-height:1;font-weight:800;letter-spacing:-.02em}
.cat span{font-size:14px;font-weight:600}
.cat small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.cat svg{position:absolute;right:-6px;bottom:-4px;width:92px;height:auto;opacity:.9;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:12px}
.task{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--pc);border:0;border-radius:26px;padding:16px 16px 16px 18px}
.task .tl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.task .tt{font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task small{color:var(--muted);font-size:12px}
.task .ring{color:var(--ink)}
.badge{align-self:flex-start;font-size:11px;padding:3px 10px;border-radius:999px;background:var(--ink);color:var(--ink-fg);font-weight:700;margin-bottom:6px}
.badge.ok{background:var(--yes);color:#fff}
.avs{display:flex;align-items:center;margin-top:8px;min-height:30px}
.avs img,.avs i{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--pc);margin-left:-8px;background:var(--surface)}
.avs>:first-child{margin-left:0}
.avs i{display:inline-grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:var(--surface)}
.avs em{font-style:normal;font-size:12px;color:var(--muted);margin-left:8px}
.empty{margin-top:22px;padding:30px 20px;border-radius:26px;background:var(--p3);text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:18px;margin-bottom:6px}

/* form */
section.sec{margin-top:18px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px)}
.sh{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
.sh h2{font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em}
.cnt{font-size:12px;font-weight:700;background:var(--surface);border-radius:999px;padding:4px 10px;font-family:var(--mono)}
.card{background:var(--pc,var(--surface));border-radius:26px;padding:6px 14px 14px;overflow:hidden}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 0;border-top:1px solid rgba(0,0,0,.07)}
@media (prefers-color-scheme:dark){.row{border-top-color:rgba(255,255,255,.08)}}
.row:first-child{border-top:0}
.lab{flex:1 1 7rem;min-width:0;font-weight:500}
.lab span{display:block}
.rule{font-size:12px;color:var(--muted)}
.rule.ok{color:var(--yes);font-weight:600} .rule.bad{color:var(--no);font-weight:600}
.yn{display:flex;gap:8px;flex:0 0 auto}
.yn button{min-width:78px;min-height:46px;border:0;background:var(--btn-soft);border-radius:999px;font-weight:700;color:var(--btn-soft-fg)}
.yn button[aria-pressed="true"].e{background:var(--yes);color:#fff}
.yn button[aria-pressed="true"].h{background:var(--no);color:#fff}
.yn.sel{flex-wrap:wrap}
.yn.sel button{min-width:72px;padding:0 14px}
.yn.sel button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}
.fld{display:flex;align-items:center;gap:8px;flex:0 1 11.5rem;min-width:0}
.fld input{width:100%;min-width:0;min-height:46px;border:0;background:var(--surface);border-radius:16px;padding:0 14px}
.fld input.n{text-align:right;font-family:var(--mono)}
.fld .u{font-size:12px;color:var(--muted);white-space:nowrap}
textarea{width:100%;min-height:100px;border:0;background:var(--surface);border-radius:16px;padding:12px;resize:vertical}
.row.col{display:block}
.row.col .lab{margin-bottom:8px}
.maplink{font-size:13px;color:var(--ink);font-weight:700;white-space:nowrap}
.photos{margin-top:10px;padding:12px;border-radius:20px;background:rgba(255,255,255,.55)}
@media (prefers-color-scheme:dark){.photos{background:rgba(0,0,0,.2)}}
.photos .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
.thumb{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .acts{position:absolute;inset:auto 0 0 0;display:flex;background:rgba(0,0,0,.55)}
.thumb .acts button{flex:1;border:0;background:none;color:#fff;font-size:12px;min-height:32px}
.vh{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.iconbtn{border:0;background:var(--btn);border-radius:999px;min-height:42px;padding:0 16px;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--btn-fg);box-shadow:0 2px 6px rgba(31,78,121,.25)}
.iconbtn.danger{background:var(--no);color:#fff}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
.set label{display:block;font-weight:700;margin-top:14px}
.set .rule{margin-top:2px}
.set input[type=text],.set input[type=email]{width:100%;min-height:48px;border:0;background:var(--surface);border-radius:16px;padding:0 14px;margin-top:8px}
.pad{padding:8px 16px 18px}
.sp{display:flex;gap:8px;margin-top:16px}

/* alt çubuk: yüzen siyah hap */
.dock{position:fixed;inset:auto 0 0 0;padding:26px 18px calc(14px + env(safe-area-inset-bottom,0px));z-index:6;pointer-events:none;background:linear-gradient(to top,var(--bg) 55%,transparent)}
.dock .wrap{display:flex;gap:10px;pointer-events:auto}
.primary{flex:1;background:var(--ink);color:var(--ink-fg);border:0;border-radius:999px;min-height:56px;padding:0 22px;font-weight:700;font-size:16px;box-shadow:0 8px 20px rgba(31,78,121,.28)}
.primary[disabled]{opacity:.55}
.dock .iconbtn{min-height:56px;padding:0 14px;white-space:nowrap}
.dock .primary{white-space:nowrap;padding-inline:14px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ink-fg);padding:12px 18px;border-radius:999px;font-size:13px;z-index:9;max-width:90vw;text-align:center}
/* Excel görünümü */
.xl tr.first td{border-top:2px solid #1f4e79}
.xlban{margin-top:10px;border-radius:18px 18px 0 0;overflow:hidden;background:#deeaf1;color:#1f4e79;text-align:center;font-family:Arial,sans-serif}
.xlban b{display:block;background:#1f4e79;color:#fff;font-size:14px;padding:12px}
.xlban span{display:block;font-size:11px;padding:8px 10px}
.xlwrap{overflow:auto;background:#fff;border-radius:0 0 18px 18px;max-height:calc(100vh - 290px);-webkit-overflow-scrolling:touch}
table.xl{border-collapse:separate;border-spacing:0;font:11px/1.35 Arial,sans-serif;color:#14202e;min-width:100%}
table.xl th{color:#fff;font-weight:700;text-align:center;padding:8px 8px;position:sticky;top:0;z-index:2;white-space:nowrap}
table.xl td{border-bottom:1px solid #d0d7e0;border-right:1px solid #e3e8ee;padding:6px 8px;text-align:center;vertical-align:middle;background:#fff;min-width:72px}
table.xl td.l{text-align:left;white-space:pre-line;min-width:150px}
table.xl td.b{font-weight:700}
table.xl .stk{position:sticky;z-index:1}
table.xl th.stk{z-index:3}
table.xl .s0{left:0}
table.xl:not(.xd) .s0{min-width:34px;max-width:34px;padding-inline:4px}
table.xl:not(.xd) .s1{left:34px;min-width:104px;box-shadow:2px 0 0 #d0d7e0}
table.xd .s0{min-width:150px;max-width:150px;white-space:normal;box-shadow:2px 0 0 #d0d7e0}
table.xd td.mut{min-width:60px;font-size:10px}
table.xl td.ok{background:#c6efce;color:#006100;font-weight:700}
table.xl td.bad{background:#ffc7ce;color:#9c0006;font-weight:700}
table.xl td.mid{background:#ffeb9c;color:#9c5700;font-weight:700}
table.xl td.yes{background:#e2efda;color:#006100;font-weight:700}
table.xl td.no{background:#fce4d6;color:#9c0006;font-weight:700}
table.xl td.mut{color:#595959}
table.xl tr.band td{background:#595959;color:#fff;font-weight:700;text-align:left;padding:6px 10px;position:static}
table.xl tr.foot td{font-weight:700;border-top:2px solid #1f4e79}
table.xl a{color:#0563c1;font-weight:600;text-decoration:none}
.xband{color:#fff;font:700 12px Arial,sans-serif;padding:8px 12px}
.xph{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;padding:8px}
.xph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:#e3e8ee}
.fl{display:grid;grid-template-columns:1fr 1fr 46px;gap:6px;background:rgba(255,255,255,.55);padding:8px;border-radius:16px;margin-top:8px}
@media (prefers-color-scheme:dark){.fl{background:rgba(0,0,0,.2)}}
.fl input{min-width:0;width:100%;min-height:44px;border:0;background:var(--surface);border-radius:14px;padding:0 12px}
.fl input.fa{grid-column:1/3}
.fl input.n{text-align:right;font-family:var(--mono)}
.fl .fx{grid-column:3;grid-row:1;width:46px;min-height:44px;border:0;background:var(--btn);border-radius:14px;font-size:22px;color:var(--btn-fg);font-weight:700}
.selbar{display:flex;align-items:center;gap:10px;margin:12px 0 10px;width:100%;border:0;background:var(--btn);color:var(--btn-fg);border-radius:18px;padding:12px 16px;text-align:left;box-shadow:0 2px 6px rgba(31,78,121,.25)}
.selbar b{display:block;font-size:14px}
.selbar small{display:block;font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68vw}
.selbar span.ar{margin-left:auto;font-size:18px}
#sheetbg{position:fixed;inset:0;z-index:20;border:0;background:rgba(8,20,32,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .2s}
#sheetbg.open{opacity:1;pointer-events:auto}
#topsheet{position:fixed;left:0;right:0;top:0;z-index:21;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border:1px solid var(--glass-line);border-top:0;border-radius:0 0 28px 28px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;box-shadow:0 18px 40px rgba(0,0,0,.3);transform:translateY(-105%);transition:transform .25s ease;max-height:82vh;display:flex;flex-direction:column}
#topsheet.open{transform:none}
#topsheet .in{max-width:640px;margin-inline:auto;width:100%;display:flex;flex-direction:column;min-height:0}
#topsheet h3{margin:0 0 2px;font-size:16px}
#topsheet .lst{overflow:auto;margin:10px 0;display:flex;flex-direction:column;gap:8px;min-height:0}
.srow{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:12px;padding:8px 12px;text-align:left;font-weight:600;font-size:14px;min-height:40px}
.srow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow small{flex:0 0 auto;font-weight:500;font-size:11px;color:var(--muted)}
.srow .bx{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:2px solid var(--btn);background:transparent;display:grid;place-items:center;color:transparent;font-size:13px;line-height:1}
.srow.on{background:rgba(46,117,182,.24);border-color:transparent}
.vlist{display:flex;flex-direction:column;gap:10px}
.visit{display:flex;align-items:center;gap:12px;background:var(--pc);border-radius:22px;padding:10px 12px 10px 10px}
.visit .vd{flex:0 0 auto;width:54px;height:58px;border:0;border-radius:16px;background:var(--btn);color:var(--btn-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.visit .vd b{font-size:22px}
.visit .vd span{font-size:11px;font-weight:700;text-transform:uppercase;opacity:.9}
.visit.late .vd{background:var(--no)}
.visit .vi{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;gap:2px;color:var(--fg)}
.visit .vi .tt{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visit .vi small{font-size:12px;color:var(--muted)}
.badge.late{background:var(--no-soft);color:var(--no)}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;border:0;border-radius:12px;padding:7px 4px;font-size:12px;font-weight:700;background:rgba(255,255,255,.3);color:var(--fg)}
.seg button b{display:block;font-size:17px}
.seg button.on{background:var(--btn);color:var(--btn-fg)}
@media (prefers-color-scheme:dark){.seg button{background:rgba(255,255,255,.07)}}
.vs{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.35);border-radius:12px;padding:0 12px;min-height:40px;margin-bottom:8px}
.vs input{flex:1;min-width:0;border:0;background:transparent;min-height:38px;outline:0}
@media (prefers-color-scheme:dark){.vs{background:rgba(255,255,255,.07)}}
.vrow small{max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .pcn{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--btn);font-family:var(--mono)}
.vform label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 2px 4px}
.vform input{width:100%;min-height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.45);padding:0 12px;color:var(--fg)}
@media (prefers-color-scheme:dark){.vform input{background:rgba(255,255,255,.08)}}
.vform+.acts2{margin-top:14px}
.srow{background:rgba(255,255,255,.28)}
@media (prefers-color-scheme:dark){.srow{background:rgba(255,255,255,.05)}}
.srow.on .bx{background:var(--btn);border-color:var(--btn);color:#fff}
#topsheet .lst{gap:6px}
#sidemenu{position:fixed;top:0;bottom:0;right:0;width:min(84vw,320px);z-index:21;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border-left:1px solid var(--glass-line);box-shadow:-12px 0 40px rgba(0,0,0,.3);transform:translateX(105%);transition:transform .25s ease;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 16px;display:flex;flex-direction:column;border-radius:24px 0 0 24px}
#sidemenu.open{transform:none}
#sidemenu .hd{display:flex;align-items:center;justify-content:space-between;margin:0 6px 10px}
#sidemenu .hd b{font-size:17px}
#sidemenu .x{width:36px;height:36px;border-radius:50%;border:0;background:var(--btn);color:var(--btn-fg);font-size:20px;line-height:1}
.mrow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;color:var(--fg);padding:13px 10px;border-radius:14px;text-align:left;font-size:15px;font-weight:600}
.mrow:active{background:var(--btn-soft)}
.mrow .mi{width:26px;text-align:center;font-size:20px}
.mrow small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:1px}
.mrow+.mrow{border-top:1px solid var(--line);border-radius:0}

<script src="exceljs.min.js"></script>
<script>
/* ---------- Kriter şeması (Depo İnceleme Kriterleri.xlsx > Detaylar) ---------- */
const Y='yn',N='num',T='text',A='area',S='sel',TF='floors',TC='calc';
const KAPLAMA=['Taş yünü','PIR','PUR'];
const SECTIONS=[
 {id:'genel',title:'Genel bilgi',x:null,f:[
  {k:'ad',x:'DEPO İSMİ',t:T},{k:'iletisim',x:'Yetkili Gayrimenkul',l:'Yetkili gayrimenkul',t:T},{k:'konum',x:'Location',l:'Konum (harita linki)',t:T,link:1},
  {k:'kira',x:'Rental Price',l:'Kira bedeli',t:N,u:'USD/m²'},{k:'opHazir',x:'Operasyon Hazır',t:Y}]},
 {id:'durum',title:'Genel durum',x:'GENEL DURUM',f:[
  {k:'oturum',x:'Depo oturumu',t:N,u:'m²'},{k:'munferit',x:'Her kata münferit giriş',t:Y},
  {k:'ruhsat',x:'İnşaat Ruhsatı alınmış',t:Y},{k:'insaat',x:'İnşaat devam ediyor',t:Y},{k:'iskan',x:'İskan alınmış',t:Y}]},
 {id:'alan',title:'Alan ve yükseklik',x:'DEPO ALAN VE YÜKSEKLİKLER',f:[
  {k:'kapali',x:'Toplam Kapalı Alan',t:N,u:'m²'},{k:'parsel',x:'Parsel Alanı',t:N,u:'m²'},
  {k:'dis',x:'Dış Alan',t:N,u:'m²'},
  {k:'hz',x:'Zemin Yükseklik >12 m',l:'Zemin yükseklik',t:N,u:'m',min:12},
  {k:'hb',x:'Bodrum Yükseklik > 10 m',l:'Bodrum yükseklik',t:N,u:'m',min:10},
  {k:'ha',x:'Asma Kat Yükseklik',t:N,u:'m'},
  {k:'yuk',x:'Zemin Döşeme Taşıma Yükü Ton/m2 > 2,5 ton',l:'Zemin döşeme taşıma yükü',t:N,u:'t/m²',min:2.5},
  {k:'opkap',x:'Operasyon alanı kaplaması (tür)',l:'Operasyon alanı kaplaması (tür)',t:T},
  {k:'aksx',x:'Aks aralığı X yönü (m)',l:'Aks aralığı, X yönü',t:N,u:'m'},{k:'aksy',x:'Aks aralığı Y yönü (m)',l:'Aks aralığı, Y yönü',t:N,u:'m'}]},
 {id:'kat',title:'Kat ve depolama',x:'KAT VE DEPOLAMA',f:[
  {k:'katsayi',x:'Kat sayısı',t:N,u:'kat'},
  {k:'katlar',x:'Kat bilgileri (kat adı, depolama m², mezanin m²)',l:'Kat bilgileri',t:TF},
  {k:'deptop',x:'Depolama toplam (m²)',t:TC,sum:'dep',u:'m²'},
  {k:'mezvar',x:'Mezanin kat mevcut',t:Y},
  {k:'meztop',x:'Mezanin toplam (m²)',t:TC,sum:'mez',u:'m²'}]},
 {id:'yukleme',title:'Yükleme alanı',x:'YÜKLEME ALANI',f:[
  {k:'manevra',x:'Manevra alanı > 35 m',l:'Manevra alanı',t:N,u:'m',min:35},
  {k:'rampa',x:'Rampalar (1/1000 m2)',l:'Rampa sayısı',t:N,u:'adet'},
  {k:'rampakapi',x:'Rampa kapısı türü',t:T},
  {k:'giris',x:'Depo araç giriş rampası',t:Y},{k:'saha',x:'Dış saha kaplaması (tür)',l:'Dış saha kaplaması (tür)',t:T}]},
 {id:'cephe',title:'Cephe ve çatı',x:'CEPHE ve ÇATI',f:[
  {k:'cephe',x:'Cephe Kaplaması',t:S},{k:'cati',x:'Çatı Kaplaması',t:S},
  {k:'isiklik',x:'Işıklık >%8',l:'Işıklık oranı',t:N,u:'%',min:8},
  {k:'gun',x:'Gün ışığı mevcut',t:Y},{k:'duman',x:'Çatı Duman rezervasyonu',t:Y},{k:'sifonik',x:'Sifonik sistem mevcut',t:Y}]},
 {id:'yangin',title:'Yangın',x:'YANGIN',f:[
  {k:'algi',x:'Yangın algılama mevcut',t:Y},{k:'algiNfpa',x:'Yangın algılama NFPA uyumlu',t:Y},
  {k:'sprk',x:'Sprinkler mevcut',t:Y},{k:'esfr',x:'Sprinkler ESFR uyumlu',t:Y},{k:'hidrant',x:'Dış Hidrant mevcut',t:Y},
  {k:'sutank',x:'Su Deposu mevcut',t:Y},{k:'suhacim',x:'Su deposu hacmi (m³)',l:'Su deposu hacmi',t:N,u:'m³',dep:'sutank'},
  {k:'pdizel',x:'Yangın pompası dizel',t:Y},{k:'pelek',x:'Yangın pompası elektrikli',t:Y},{k:'pmarka',x:'Yangın pompası markası',t:T}]},
 {id:'elektrik',title:'Elektrik',x:'ELEKTRİK',f:[
  {k:'trafo',x:'Trafo mevcut',t:Y},{k:'trafokva',x:'Trafo gücü (kVA)',l:'Trafo gücü',t:N,u:'kVA',dep:'trafo'},
  {k:'pano',x:'Dağıtım panosu mevcut',t:Y},{k:'solar',x:'Solar Sistem mevcut',t:Y},
  {k:'led',x:'Aydınlatma LED mevcut',t:Y},{k:'lux',x:'Aydınlatma seviyesi (lux)',l:'Aydınlatma seviyesi',t:N,u:'lux',dep:'led'},{k:'disay',x:'Dış aydınlatma mevcut',t:Y},{k:'aku',x:'Akü şarj odası mevcut',t:Y},
  {k:'jen',x:'Jeneratör mevcut',t:Y},{k:'ofispano',x:'Ofis pano mevcut',t:Y}]},
 {id:'guvenlik',title:'Güvenlik',x:'GÜVENLİK',f:[
  {k:'duvar',x:'Depo etrafı duvar mevcut',t:Y},{k:'kamera',x:'Kamera sistemi mevcut',t:Y},{k:'anons',x:'Anons sistemi mevcut',t:Y},
  {k:'kulube',x:'Güvenlik Kulübesi mevcut',t:Y},{k:'bariyer',x:'Saha  giriş bariyeri mevcut',l:'Saha giriş bariyeri mevcut',t:Y},
  {k:'yaya',x:'Yaya yolları mevcut',t:Y},{k:'sofor',x:'Şöfor bekleme od. mevcut',l:'Şoför bekleme odası mevcut',t:Y}]},
 {id:'yorum',title:'Yorumlar',x:'YORUMLAR',f:[
  {k:'avantaj',x:'Avantajlar',t:A},{k:'dezavantaj',x:'Dezavantajlar',t:A}]}
];
const ALLF=SECTIONS.flatMap(s=>s.f);
const countable=f=>f.t!==A&&f.t!==TF&&f.t!==TC&&!f.dep;
const COUNTED=ALLF.filter(countable);

/* ---------- Yerel depo (IndexedDB): kayıtlar, fotoğraf dosyaları, ayarlar ---------- */
let _db=null;
function idb(){
  if(_db)return _db;
  _db=new Promise((res,rej)=>{
    const r=indexedDB.open('depo-inceleme',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('rec',{keyPath:'id'});d.createObjectStore('photo',{keyPath:'id'});d.createObjectStore('kv')};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  return _db;
}
async function store(name,mode,fn){
  const d=await idb();
  return new Promise((res,rej)=>{
    const t=d.transaction(name,mode),s=t.objectStore(name);let req=fn(s);
    t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
  });
}
const dbPut=(n,v,k)=>store(n,'readwrite',s=>k===undefined?s.put(v):s.put(v,k));
const dbGet=(n,k)=>store(n,'readonly',s=>s.get(k));
const dbAll=n=>store(n,'readonly',s=>s.getAll());
const dbDel=(n,k)=>store(n,'readwrite',s=>s.delete(k));

/* ---------- Durum ---------- */
let records=new Map(), cur=null, view='list', cfg={mail:'',photos:true};
let saveTimer=null, chain=Promise.resolve(), urls=new Map(), installEvt=null, sending=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,ms=2800){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms)}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const fmtDate=ts=>new Date(ts).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'});
const APP_V='v14';
const slug=s=>String(s||'depo').normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/ı/g,'i').replace(/İ/g,'I').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')||'depo';
function norm(r){
  r.v=r.v||{};r.photos=r.photos||[];
  if(!Array.isArray(r.v.katlar)){
    r.v.katlar=[];
    if(r.v.zemin||r.v.bodrum){
      if(r.v.zemin)r.v.katlar.push({ad:'Zemin Kat',dep:String(r.v.zemin),mez:''});
      if(r.v.bodrum)r.v.katlar.push({ad:'Bodrum Kat',dep:String(r.v.bodrum),mez:''});
    }
  }
  return r}
function answered(rec){return COUNTED.filter(f=>{const v=rec.v[f.k];return v!==undefined&&v!==''&&v!==null}).length}
const pct=rec=>Math.round(answered(rec)/COUNTED.length*100);

function persist(rec){
  rec.updatedAt=Date.now();
  chain=chain.then(async()=>{
    try{await dbPut('rec',rec);if(view==='form')$('saved').textContent='Kaydedildi'}
    catch(e){$('saved').textContent='Kaydedilemedi';toast('Kayıt başarısız. Telefonun depolama alanını kontrol edin.')}
  });
  return chain;
}
function touch(){cur.dirty=true;$('saved').textContent='…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>persist(cur),500)}
async function flush(){clearTimeout(saveTimer);if(cur&&$('saved').textContent==='…')persist(cur);await chain}

/* ---------- Görsel yardımcılar ---------- */
function ringSvg(p,size,sw){
  const r=(size-sw)/2,c=2*Math.PI*r,m=size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Doluluk yüzde ${p}"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".14" stroke-width="${sw}"/><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p/100)).toFixed(1)}" transform="rotate(-90 ${m} ${m})"/><text x="${m}" y="${m}" text-anchor="middle" dominant-baseline="central" font-size="${(size*.27).toFixed(0)}" font-weight="700" fill="currentColor">${p}%</text></svg>`;
}
const ART_WH='<svg viewBox="0 0 90 70" aria-hidden="true"><path d="M4 30 45 8l41 22v36H4z" fill="currentColor" opacity=".13"/><rect x="16" y="34" width="58" height="30" rx="4" fill="currentColor" opacity=".2"/><g fill="#fff" opacity=".85"><rect x="22" y="40" width="14" height="24" rx="2"/><rect x="40" y="40" width="14" height="24" rx="2"/><rect x="58" y="40" width="10" height="24" rx="2"/></g><path d="M4 30 45 8l41 22" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" opacity=".55"/></svg>';
const ART_MAIL='<svg viewBox="0 0 90 70" aria-hidden="true"><rect x="8" y="14" width="74" height="48" rx="8" fill="currentColor" opacity=".16"/><path d="M12 20l33 24 33-24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/><circle cx="70" cy="52" r="14" fill="currentColor" opacity=".9"/><path d="M63 52l5 5 9-10" fill="none" stroke="var(--pc)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_SEARCH='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
const ICON_MENU='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
const ART_CAL='<svg viewBox="0 0 90 70" aria-hidden="true"><rect x="14" y="12" width="62" height="52" rx="9" fill="currentColor" opacity=".18"/><rect x="14" y="12" width="62" height="16" rx="7" fill="currentColor" opacity=".5"/><g fill="currentColor" opacity=".75"><circle cx="30" cy="42" r="4"/><circle cx="45" cy="42" r="4"/><circle cx="60" cy="42" r="4"/><circle cx="30" cy="54" r="4"/><circle cx="45" cy="54" r="4"/></g></svg>';
const ICON_MAIL='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>';
const colorOf=r=>'pc'+(1+[...String(r.id)].reduce((a,c)=>a+c.charCodeAt(0),0)%5);
const isShared=r=>!!(r.sharedAt&&!r.dirty);
/* rapor durumu: todo = hazırlanmadı (veya hazırlandıktan sonra değişti), ready = hazırlandı, shared = paylaşıldı */
const statusOf=r=>isShared(r)?'shared':(r.reportFor&&r.reportFor===r.updatedAt)?'ready':'todo';
function markReport(recs){recs.forEach(r=>{r.reportFor=r.updatedAt;try{dbPut('rec',r)}catch(e){}})}
let visits=[],visSeg='';
const saveVisits=()=>{try{dbPut('kv',visits,'visits')}catch(e){}};
const pad2=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const isoDate=x=>{const [y,m,d]=x.split('-').map(Number);return new Date(y,m-1,d)};
const plannedVisits=()=>visits.filter(v=>!v.recId).sort((a,b)=>a.date.localeCompare(b.date));
function visitWhen(v){
  const diff=Math.round((isoDate(v.date)-isoDate(todayISO()))/864e5);
  const d=isoDate(v.date),long=d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});
  return {diff,long,label:diff<0?'Gecikmiş':diff===0?'Bugün':diff===1?'Yarın':'' ,late:diff<0,day:d.getDate(),mon:d.toLocaleDateString('tr-TR',{month:'short'}).replace('.','')};
}

/* ---------- Ana sayfa ---------- */
let listFilter='', listQ='';
function plannedCardHtml(v){
  const w=visitWhen(v);
  return `<div class="visit ${w.late?'late':''} pc3"><button class="vd" data-vedit="${v.id}" aria-label="Ziyareti düzenle"><b>${w.day}</b><span>${esc(w.mon)}</span></button><button class="vi" data-vedit="${v.id}"><span class="tt">${esc(v.name)}</span><small>${w.label?`<span class="badge ${w.late?'late':'ok'}" style="font-size:10px;padding:1px 7px;margin-right:6px">${w.label}</span>`:''}${esc(w.long)} · ziyaret edilecek${v.note?' · '+esc(v.note):''}</small></button><button class="iconbtn" data-vstart="${v.id}" style="min-height:38px;padding:0 14px;font-size:13px">Başlat</button></div>`;
}
function renderList(){
  view='list';cur=null;readyPack=null;revokeUrls();
  $('title').textContent='';$('back').hidden=true;$('chips').hidden=true;$('progwrap').hidden=true;$('gear').hidden=false;$('saved').textContent='';
  $('gear').innerHTML=ICON_MENU;
  const all=[...records.values()];
  const cnt={todo:0,ready:0,shared:0};all.forEach(r=>cnt[statusOf(r)]++);
  const pl=plannedVisits();
  const first=(cfg.name||'').trim().split(/\s+/)[0];
  let h=`<div class="hello"><h2>Merhaba${first?', '+esc(first):''}</h2><p>${pl.length||all.length?`${pl.length} planlanan ziyaret · ${cnt.todo} raporu hazırlanmadı`:'Sahaya hazır'}</p></div>
  <div class="cats" style="margin-top:20px">
    <button class="cat pc1" data-addvisit="1"><div><span>Planlanan ziyaretler</span><small>+ ziyaret ekle</small></div><b>${pl.length}</b>${ART_CAL}</button>
    <button class="cat pc2" id="openvisited"><div><span>Ziyaret edilenler</span><small>${cnt.todo} hazırlanmadı · ${cnt.ready} hazır · ${cnt.shared} paylaşıldı</small></div><b>${all.length}</b>${ART_WH}</button>
  </div>
  <h3 class="sh2">Planlanan ziyaretler <span><button class="iconbtn" data-addvisit="1" style="min-height:34px;padding:0 14px;font-size:13px">+ Ziyaret ekle</button></span></h3>`;
  h+=pl.length?`<div class="vlist">${pl.map(plannedCardHtml).join('')}</div>`:`<div class="empty"><b>Planlanan ziyaret yok</b>Gideceğiniz depoyu ve tarihi eklemek için "+ Ziyaret ekle"ye dokunun. Eklenen ziyaretler burada tarihle birlikte listelenir.</div>`;
  $('main').innerHTML=h;
  renderDock();window.scrollTo(0,0);
}
/* ---------- Ziyaret edilenler penceresi ---------- */
function visitedListHtml(){
  const q=(listQ||'').trim().toLocaleLowerCase('tr');
  const items=[...records.values()].filter(r=>statusOf(r)===visSeg&&(!q||(r.v.ad||'Adsız depo').toLocaleLowerCase('tr').includes(q))).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(!items.length)return `<div class="empty2" style="font-size:13px">${q?'Sonuç yok':'Bu grupta ziyaret yok'}</div>`;
  return items.map(r=>`<button class="srow vrow" data-open="${r.id}"><span class="nm">${esc(r.v.ad||'Adsız depo')}</span><small>${fmtDate(r.createdAt)}${r.photos.length?' · '+r.photos.length+' foto':''}${r.by?' · '+esc(r.by):''}</small><span class="pcn">%${pct(r)}</span></button>`).join('');
}
function visitedHtml(){
  const cnt={todo:0,ready:0,shared:0};[...records.values()].forEach(r=>cnt[statusOf(r)]++);
  const sg=(k,l)=>`<button data-seg="${k}" class="${visSeg===k?'on':''}"><b>${cnt[k]}</b>${l}</button>`;
  return `<div class="in"><h3>Ziyaret edilenler</h3>
  <div class="seg">${sg('todo','Hazırlanmayan')}${sg('ready','Hazırlanan')}${sg('shared','Paylaşılan')}</div>
  <label class="vs">${ICON_SEARCH}<input id="vq" type="search" placeholder="Depo ara" autocomplete="off" value="${esc(listQ)}"></label>
  <div class="lst" id="vlist">${visitedListHtml()}</div>
  <span class="hint" style="margin:0 2px 8px">Excel/PDF indirildiğinde veya e-posta hazırlandığında "Hazırlanan"a, paylaşıldığında "Paylaşılan"a geçer.</span>
  <div class="acts2"><button class="iconbtn" id="sheetbg2" style="min-height:44px;width:100%;justify-content:center;font-size:14px">Kapat</button></div></div>`;
}
function openVisited(){
  const cnt={todo:0,ready:0,shared:0};[...records.values()].forEach(r=>cnt[statusOf(r)]++);
  if(!visSeg||!cnt[visSeg])visSeg=cnt.todo?'todo':cnt.ready?'ready':cnt.shared?'shared':'todo';
  $('topsheet').innerHTML=visitedHtml();$('topsheet').classList.add('open');$('sheetbg').classList.add('open');$('topsheet').setAttribute('aria-hidden','false');
}
/* ---------- Ziyaret ekle / düzenle ---------- */
let editVisitId=null;
function visitSheetHtml(v){
  const names=[...new Set([...records.values()].map(r=>r.v.ad).concat(visits.map(x=>x.name)).filter(Boolean))];
  return `<div class="in"><h3>${v?'Ziyareti düzenle':'Ziyaret ekle'}</h3><div class="vform">
  <label for="vdate">Tarih</label><input id="vdate" type="date" value="${esc(v?v.date:todayISO())}">

/* ---------- Fotoğraf ---------- */
function shrink(file,max=1600){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',0.82);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};img.src=u;
  });
}
/* HEIC/HEIF (iPhone fotoğrafları bilgisayarda/Edge'de açılmaz) → JPEG'e çevrilir. Kütüphane yalnızca gerektiğinde yüklenir. */
async function toDecodable(file){
  try{await loadImg(file);return file}catch(e){}
  if(!window.heic2any)await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='heic2any.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('lib'));document.head.appendChild(sc)});
  const out=await window.heic2any({blob:file,toType:'image/jpeg',quality:0.85});
  return Array.isArray(out)?out[0]:out;
}
async function addPhotos(secId,files){
  const rec=cur;if(!rec)return;
  const sec=SECTIONS.find(s=>s.id===secId);let ok=0;
  toast(files.length+' fotoğraf kaydediliyor…');
  for(const f of files){
    try{
      let blob;
      try{blob=await shrink(await toDecodable(f))}
      catch(e){const ext=(f.name.split('.').pop()||'').toUpperCase();throw new Error(e&&e.message==='lib'?`"${f.name}" HEIC dosyasıdır; dönüştürücü yüklenemedi. İnternetliyken tekrar deneyin.`:`"${f.name}" açılamadı (${f.type||ext}). JPG veya PNG deneyin.`)}
      const id=uid();
      try{await dbPut('photo',{id,recId:rec.id,blob})}catch(e){throw new Error('Tarayıcı depolaması dolu veya kapalı (özel/InPrivate pencere olabilir).')}
      const n=rec.photos.filter(p=>p.sec===secId).length+1;
      rec.photos.push({id,sec:secId,n:`${slug(rec.v.ad)}_${slug(sec.title)}_${String(n).padStart(2,'0')}_${id.slice(0,4)}.jpg`});ok++;
    }catch(e){toast((e&&e.message)||'Fotoğraf eklenemedi.',7000)}
  }
  if(ok){rec.dirty=true;await persist(rec);if(cur===rec)rerenderKeepScroll();toast(ok+' fotoğraf eklendi')}
}
async function savePhoto(id){
  const p=await dbGet('photo',id),m=cur.photos.find(x=>x.id===id);if(!p||!m)return;
  const file=new File([p.blob],m.n,{type:'image/jpeg'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(p.blob);a.download=m.n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

const sumIdx=id=>SUMC.findIndex(c=>c.id===id);
function sumRows(r,idx){
  const v=r.v,[m,t]=targets(r),FL=floorsOf(r),n=Math.max(1,FL.length),dep=sumOf(r,'dep'),mez=sumOf(r,'mez'),kn=toN(v.katsayi);
  const base={no:idx+1,ad:v.ad||'Adsız depo',yg:v.iletisim||'',ozet:ozetText(r),konum:v.konum||'',kira:numOf(r,'kira'),hedef:t?`${m}/${t}`:'—',kapali:numOf(r,'kapali'),
    katsayi:kn!==null?`${kn} Katlı`:(v.katsayi||''),deptop:dep,mezvar:v.mezvar||(mez?'Evet':''),meztop:mez,
    hz:numOf(r,'hz'),hb:numOf(r,'hb'),aks:(v.aksx||v.aksy)?`${v.aksx||'?'} × ${v.aksy||'?'}`:'',yuk:numOf(r,'yuk'),manevra:numOf(r,'manevra'),rampa:numOf(r,'rampa'),isiklik:numOf(r,'isiklik'),gor:repPhotos(r).length};
  const rows=[];
  for(let i=0;i<n;i++){
    const row={},k=FL[i];
    SUMC.forEach(c=>{
      if(c.fl)row[c.id]=!k?null:c.id==='kat'?(k.ad||''):c.id==='katdep'?toN(k.dep):toN(k.mez);
      else row[c.id]=i===0?base[c.id]:null;
    });
    rows.push(row);
  }
  return rows;
}

        if(t){const hc=ws.getCell(row,sumIdx('hedef')+1),all=m===t;hc.fill=fill(all?'FFC6EFCE':(m===0?'FFFFC7CE':'FFFFEB9C'));hc.font=AR(9,true,all?'FF006100':(m===0?'FF9C0006':'FF9C5700'))}
        SUMC.filter(c=>c.th).forEach(c=>{const f=ALLF.find(z=>z.k===c.th),n2=numOf(r,c.th);if(n2===null)return;const ok=n2>=f.min,cc=ws.getCell(row,sumIdx(c.id)+1);cc.fill=fill(ok?'FFC6EFCE':'FFFFC7CE');cc.font=AR(9,true,ok?'FF006100':'FF9C0006')});

        c.alignment={horizontal:f.t===A||f.t===TF?'left':'center',vertical:f.t===A||f.t===TF?'top':'middle',wrapText:true};

function thumbOf(blob,max=900){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(blob);
    img.onload=async()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
      c.toBlob(async b=>b?res({buf:await b.arrayBuffer(),w,h}):rej(new Error('thumb')),'image/jpeg',0.72);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};img.src=u;
  });
}
async function addPhotoSheet(wb,recs){
  const COLS=3,CW=44,BW=300,BH=225,ROWH=177;
  const ws=wb.addWorksheet('Fotoğraflar',{views:[{showGridLines:false}],pageSetup:{orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0}});
  for(let i=1;i<=COLS;i++)ws.getColumn(i).width=CW;
  titleRows(ws,COLS,'DEPO İNCELEME  —  FOTOĞRAFLAR');
  let r=2;
  for(const rec of recs){
    if(!repPhotos(rec).length)continue;
    for(let c=1;c<=COLS;c++){const b=ws.getCell(r,c);b.fill=fill(C_NAVY);b.font=AR(10,true,'FFFFFFFF')}
    ws.mergeCells(r,1,r,COLS);ws.getCell(r,1).value=rec.v.ad||'Adsız depo';ws.getRow(r).height=20;ws.getCell(r,1).alignment={vertical:'middle'};r++;
    for(const s of SECTIONS){
      const list=repPhotos(rec).filter(p=>p.sec===s.id);if(!list.length)continue;
      for(let c=1;c<=COLS;c++){const b=ws.getCell(r,c);b.fill=fill(C_BLUE);b.font=AR(9,true,'FFFFFFFF')}
      ws.mergeCells(r,1,r,COLS);ws.getCell(r,1).value=`${s.title}  (${list.length})`;ws.getRow(r).height=16;r++;
      let col=0;
      for(const p of list){
        const ph=await dbGet('photo',p.id);if(!ph)continue;
        const t=await thumbOf(ph.blob),k=Math.min(BW/t.w,BH/t.h),w=Math.round(t.w*k),h=Math.round(t.h*k);
        const id=wb.addImage({buffer:t.buf,extension:'jpeg'});
        if(col===0)ws.getRow(r).height=ROWH;
        ws.addImage(id,{tl:{col:col+0.04,row:r-1+0.04},ext:{width:w,height:h},editAs:'oneCell'});
        col++;if(col===COLS){col=0;r++}
      }
      if(col!==0)r++;
    }
    r++;
  }
}
async function buildWorkbook(recs){
  const wb=new ExcelJS.Workbook();wb.creator='Depo İnceleme';wb.created=new Date();
  addSummary(wb,recs);addDetails(wb,recs);
  if(recs.some(r=>repPhotos(r).length))await addPhotoSheet(wb,recs);
  return wb.xlsx.writeBuffer();
}
function downloadBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ---------- PDF rapor (canvas ile çizilen sayfalar → PDF; Türkçe karakterler sorunsuz) ---------- */
const PW=1240,PH=1754,PM=60,FF='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const dateLong=()=>new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
function loadImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};i.src=u})}
class PdfPages{
  constructor(){this.pages=[];this.newPage()}
  newPage(){
    const c=document.createElement('canvas');c.width=PW;c.height=PH;const x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,PW,PH);
    x.fillStyle='#1f4e79';x.fillRect(0,0,PW,74);
    x.fillStyle='#fff';x.textBaseline='middle';x.font='700 28px '+FF;x.fillText('DEPO İNCELEME RAPORU',PM,37);
    x.textAlign='right';x.font='500 22px '+FF;x.fillText(dateLong(),PW-PM,37);x.textAlign='left';
    this.c=c;this.x=x;this.y=104;this.pages.push(c);
  }
  need(h){if(this.y+h>PH-70)this.newPage()}
  wrap(text,w,font){
    const x=this.x;x.font=font;const out=[];
    String(text).split('\n').forEach(par=>{
      let line='';
      par.split(/\s+/).forEach(word=>{
        let wd=word;
        while(x.measureText(wd).width>w){let k=wd.length;while(k>1&&x.measureText(wd.slice(0,k)).width>w)k--;if(line){out.push(line);line=''}out.push(wd.slice(0,k));wd=wd.slice(k)}
        const t=line?line+' '+wd:wd;
        if(x.measureText(t).width>w&&line){out.push(line);line=wd}else line=t;
      });
      out.push(line);
    });

  }
  band(text,color,h,font){
    this.need(h+10);const x=this.x;x.fillStyle=color;x.fillRect(PM,this.y,PW-2*PM,h);
    x.fillStyle='#fff';x.font=font;x.textBaseline='middle';x.fillText(text,PM+16,this.y+h/2+1);this.y+=h+8;
  }
  row(label,value,tone){
    const x=this.x,LW=520,VX=PM+560,VW=PW-PM-VX-12,F='500 21px '+FF;
    const ll=this.wrap(label,LW,F),vl=this.wrap(value,VW,'600 21px '+FF);
    const h=Math.max(ll.length,vl.length)*28+14;this.need(h);
    if(tone){x.fillStyle={ok:'#C6EFCE',bad:'#FFC7CE',yes:'#E2EFDA',no:'#FCE4D6'}[tone];x.fillRect(VX-8,this.y+2,PW-PM-VX+8,h-4)}
    x.textBaseline='middle';x.font=F;x.fillStyle='#14202e';ll.forEach((l,i)=>x.fillText(l,PM+8,this.y+7+i*28+14));
    x.font='600 21px '+FF;x.fillStyle={ok:'#006100',bad:'#9C0006',yes:'#006100',no:'#9C0006'}[tone]||'#14202e';vl.forEach((l,i)=>x.fillText(l,VX,this.y+7+i*28+14));
    x.strokeStyle='#e3e8ee';x.lineWidth=1;x.beginPath();x.moveTo(PM,this.y+h);x.lineTo(PW-PM,this.y+h);x.stroke();this.y+=h;
  }
  tiles(list,per){
    const gap=14,w=(PW-2*PM-gap*(per-1))/per,h=92;
    for(let i=0;i<list.length;i+=per){
      this.need(h+14);
      list.slice(i,i+per).forEach((t,j)=>{
        const x0=PM+j*(w+gap),x=this.x;
        x.fillStyle=t.bg||'#deeaf1';x.beginPath();x.roundRect(x0,this.y,w,h,16);x.fill();
        x.textBaseline='middle';x.fillStyle='#5d6b7c';x.font='600 17px '+FF;x.fillText(t.l,x0+16,this.y+24);
        x.fillStyle=t.fg||'#1f4e79';x.font='700 28px '+FF;
        let v=String(t.v),fs=28;while(x.measureText(v).width>w-30&&fs>14){fs-=2;x.font='700 '+fs+'px '+FF}
        x.fillText(v,x0+16,this.y+60);
      });
      this.y+=h+14;
    }
  }
  table(heads,rows,widths,opt){
    const x=this.x,F='600 19px '+FF,G=14;
    const cellLines=(txt,w)=>this.wrap(txt,w-2*G,F);
    this.need(52);
    x.fillStyle='#2e75b6';x.fillRect(PM,this.y,PW-2*PM,52);
    x.fillStyle='#fff';x.font='700 16px '+FF;x.textBaseline='middle';
    let cx=PM;heads.forEach((h,i)=>{const ls=this.wrap(h,widths[i]-12,'700 16px '+FF);ls.forEach((l,k)=>x.fillText(l,cx+G/2,this.y+26+(k-(ls.length-1)/2)*20));cx+=widths[i]});
    this.y+=52;
    rows.forEach((r,ri)=>{
      const ls=r.map((c,i)=>cellLines(c.t,widths[i])),h=Math.max(...ls.map(l=>l.length))*26+18;
      if(this.y+h>PH-70){this.newPage()}
      if(ri%2===1){x.fillStyle='#f3f7fb';x.fillRect(PM,this.y,PW-2*PM,h)}
      let cx2=PM;
      r.forEach((c,i)=>{
        if(c.bg){x.fillStyle=c.bg;x.fillRect(cx2+2,this.y+3,widths[i]-4,h-6)}
        x.font=(c.b?'700':'600')+' 19px '+FF;x.fillStyle=c.fg||'#14202e';x.textBaseline='middle';
        ls[i].forEach((l,k)=>{const tw=x.measureText(l).width;const px=c.l?cx2+G:cx2+(widths[i]-tw)/2;x.fillText(l,px,this.y+9+k*26+13)});
        cx2+=widths[i];
      });
      x.strokeStyle='#d0d7e0';x.lineWidth=1;x.beginPath();x.moveTo(PM,this.y+h);x.lineTo(PW-PM,this.y+h);x.stroke();
      this.y+=h;
    });
    this.y+=16;
  }
  async photo(blob,col,boxW,boxH,x0){
    const img=await loadImg(blob),k=Math.min(boxW/img.width,boxH/img.height),w=img.width*k,h=img.height*k;
    this.x.drawImage(img,x0+(boxW-w)/2,this.y+(boxH-h)/2,w,h);
  }
  finish(){this.pages.forEach((c,i)=>{const x=c.getContext('2d');x.fillStyle='#6b7480';x.font='500 18px '+FF;x.textAlign='center';x.textBaseline='middle';x.fillText(`Sayfa ${i+1} / ${this.pages.length}`,PW/2,PH-34);x.textAlign='left'})}
}
function valText(f,v){
  if(typeof v==='number')return v.toLocaleString('tr-TR')+(f.u?' '+f.u:'');
  return String(v);
}
async function pdfBlob(recs){
  const pg=new PdfPages();
  const fmtM=n=>n===null||n===undefined?'—':fmtN(n)+' m²';
  if(recs.length>1){
    pg.band(`Depo karşılaştırması  —  ${recs.length} depo`,'#2e75b6',54,'700 26px '+FF);pg.y+=8;
    const totArea=recs.reduce((a,r)=>a+(numOf(r,'kapali')||0),0),totDep=recs.reduce((a,r)=>a+(sumOf(r,'dep')||0),0);
    pg.tiles([{l:'Depo sayısı',v:recs.length},{l:'Toplam kapalı alan',v:fmtN(totArea)+' m²'},{l:'Toplam depolama',v:fmtN(totDep)+' m²'}],3);
    pg.table(['#','DEPO İSMİ','YETKİLİ GAYRİMENKUL','KAPALI ALAN','KAT','DEPOLAMA TOPLAM','MEZANİN TOPLAM','HEDEF'],
      recs.map((r,i)=>{const [m,t]=targets(r),kn=toN(r.v.katsayi);return [{t:String(i+1)},{t:r.v.ad||'Adsız depo',b:1,l:1},{t:r.v.iletisim||'—',l:1},{t:fmtM(numOf(r,'kapali'))},{t:kn!==null?String(kn):'—'},{t:fmtM(sumOf(r,'dep'))},{t:fmtM(sumOf(r,'mez'))},t?{t:`${m}/${t}`,bg:m===t?'#C6EFCE':m===0?'#FFC7CE':'#FFEB9C',fg:m===t?'#006100':m===0?'#9C0006':'#9C5700',b:1}:{t:'—'}]}),
      [50,240,200,150,70,150,150,110]);
  }
  let first=recs.length===1;
  for(const rec of recs){
    if(!first)pg.newPage();first=false;
    const [m,t]=targets(rec);
    pg.band((rec.v.ad||'Adsız depo')+(t?`   |   Hedef uyumu ${m}/${t}`:''),'#2e75b6',54,'700 26px '+FF);pg.y+=6;
    const kn=toN(rec.v.katsayi);
    pg.tiles([{l:'Kapalı alan',v:fmtM(numOf(rec,'kapali'))},{l:'Kat sayısı',v:kn!==null?kn+' kat':'—'},{l:'Depolama toplam',v:fmtM(sumOf(rec,'dep'))},{l:'Mezanin toplam',v:fmtM(sumOf(rec,'mez'))},{l:'Hedef uyumu',v:t?`${m} / ${t}`:'—',bg:t?(m===t?'#C6EFCE':m===0?'#FFC7CE':'#FFEB9C'):undefined,fg:t?(m===t?'#006100':m===0?'#9C0006':'#9C5700'):undefined},{l:'Yetkili gayrimenkul',v:rec.v.iletisim||'—'}],3);
    const oz=ozetText(rec).split('\n').filter(l=>l.trim()&&!/:\s*$/.test(l));
    if(oz.length){
      pg.band('ÖZET','#595959',36,'700 19px '+FF);
      oz.forEach(l=>{const i=l.indexOf(':');if(i>0&&i<40)pg.row(l.slice(0,i),l.slice(i+1).trim()||'—','');else pg.row('',l,'')});
      pg.y+=10;
    }
    for(const s of SECTIONS){
      const rows=s.f.filter(f=>isOn(rec,f)&&cellVal(rec,f)!=='');
      if(!rows.length)continue;
      pg.band(s.x||'GENEL BİLGİ','#595959',36,'700 19px '+FF);
      rows.forEach(f=>{
        const v=cellVal(rec,f);let tone='';
        if(f.t===Y)tone=v==='Evet'?'yes':'no';
        if(f.min!==undefined&&typeof v==='number')tone=v>=f.min?'ok':'bad';
        let lab=f.l||f.x;if(f.min!==undefined)lab+=`  (hedef ≥ ${f.min} ${f.u})`;
        pg.row(lab,valText(f,v),tone);
      });
      pg.y+=10;
    }
    if(repPhotos(rec).length){
      pg.newPage();
      pg.band((rec.v.ad||'Adsız depo')+'  |  Fotoğraflar','#2e75b6',54,'700 26px '+FF);
      const BW=(PW-2*PM-24)/2,BH=380;
      for(const s of SECTIONS){
        const list=repPhotos(rec).filter(p=>p.sec===s.id);if(!list.length)continue;
        pg.band(`${s.title}  (${list.length})`,'#595959',36,'700 19px '+FF);
        for(let i=0;i<list.length;i+=2){
          pg.need(BH+14);
          for(let j=0;j<2&&i+j<list.length;j++){
            const ph=await dbGet('photo',list[i+j].id);if(!ph)continue;
            await pg.photo(ph.blob,j,BW,BH,PM+j*(BW+24));
          }
          pg.y+=BH+14;
        }

    }
  }
  pg.finish();
  const jpgs=[];
  for(const c of pg.pages){const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));jpgs.push(new Uint8Array(await b.arrayBuffer()))}
  const enc=new TextEncoder(),parts=[],offs=[];let off=0;
  const push=d=>{const u=typeof d==='string'?enc.encode(d):d;parts.push(u);off+=u.length};
  const obj=(id,fn)=>{offs[id]=off;push(`${id} 0 obj\n`);fn();push('endobj\n')};

  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>\n'));
  obj(2,()=>push(`<< /Type /Pages /Count ${N} /Kids [${jpgs.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] >>\n`));
  jpgs.forEach((j,i)=>{
    const pid=3+3*i,cid=4+3*i,iid=5+3*i,cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(pid,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>\n`));
    obj(cid,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\n`));
    obj(iid,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${PW} /Height ${PH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>\nstream\n`);push(j);push('\nendstream\n')});
  });
  const xr=off,total=3+3*N;
  let xt=`xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let id=1;id<total;id++)xt+=String(offs[id]).padStart(10,'0')+' 00000 n \n';
  push(xt+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}

/* ---------- E-posta ile rapor ----------
   iPhone'un Paylaş menüsü Excel (.xlsx) dosyasını doğrudan eklemeye izin vermeyebilir; PDF, JPG ve metin dosyalarını kabul eder.
   Bu yüzden önce PDF rapor + fotoğraflar (+ Excel kabul edilirse Excel) hazırlanır, sonra tek dokunuşla Mail'e eklenir. */
let readyPack=null;
async function preparePack(recs){
  const one=recs.length===1,base=one?`Depo_Inceleme_${slug(recs[0].v.ad)}_${todayStr()}`:`Depo_Inceleme_Raporu_${todayStr()}`;
  const xl=new File([await buildWorkbook(recs)],base+'.xlsx',{type:XLSX_MIME});
  const pdf=new File([await pdfBlob(recs)],base+'.pdf',{type:'application/pdf'});
  const photos=[];
  if(cfg.photos!==false)for(const r of recs)for(const p of repPhotos(r)){const ph=await dbGet('photo',p.id);if(ph)photos.push(new File([ph.blob],p.n,{type:'image/jpeg'}))}
  const title=one?`Depo İnceleme: ${recs[0].v.ad||'Adsız depo'} (${fmtDate(Date.now())})`:`Depo İnceleme Raporu (${fmtDate(Date.now())}) – ${recs.length} depo`;
  const text=recs.map(r=>{const [m,t]=targets(r);return `• ${r.v.ad||'Adsız depo'}${t?` – hedef uyumu ${m}/${t}`:''}, ${repPhotos(r).length} fotoğraf`}).join('\n')+'\n\nDetaylar ekteki rapordadır.';
  const can=a=>!!(navigator.canShare&&navigator.canShare({files:a}));
  const tries=[[pdf,xl,...photos],[pdf,...photos],[pdf,xl],[xl,...photos],[pdf],[...photos],[xl]];
  let files=null;
  if(navigator.share)for(const t of tries){if(t.length&&can(t)){files=t;break}}
  const label=files?[files.includes(pdf)?'PDF':'',files.includes(xl)?'Excel':'',files.filter(f=>f.type==='image/jpeg').length?files.filter(f=>f.type==='image/jpeg').length+' fotoğraf':''].filter(Boolean).join(' + '):'';
  const notes=[];
  if(files&&!files.includes(xl))notes.push('Telefon Excel dosyasını doğrudan eklemeye izin vermiyor. PDF rapor eklenir; Excel için "Excel" düğmesiyle Dosyalar\'a kaydedip Mail\'de "Ek ekle"yi kullanın.');
  if(files&&photos.length&&files.filter(f=>f.type==='image/jpeg').length===0)notes.push('Fotoğraflar PDF raporun içindedir.');
  markReport(recs);
  return {recs,xl,pdf,photos,title,text,files,label,note:notes.join(' ')};
}
function doShare(pk){
  /* Not: Safari kullanıcı dokunuşundan sonra bekletmeye izin vermez, bu yüzden burada await yok. */
  if(!pk.files)return Promise.resolve(mailFallback(pk));
  return navigator.share({files:pk.files,title:pk.title,text:pk.text}).then(()=>{
    pk.recs.forEach(r=>{r.sharedAt=Date.now();r.dirty=false;persist(r)});
    readyPack=null;renderDock();if(view==='list')renderList();
  });
}
const b64=u8=>{let s='';const C=0x8000;for(let i=0;i<u8.length;i+=C)s+=String.fromCharCode.apply(null,u8.subarray(i,i+C));return btoa(s)};
const wrap76=t=>t.replace(/.{1,76}/g,'$&\r\n');
const utf8b64=t=>b64(new TextEncoder().encode(t));
async function buildEml(pk){
  const bd='----=_Depo_'+Math.random().toString(36).slice(2);
  const files=[pk.pdf,pk.xl,...(pk.photos||[])];
  let o=`X-Unsent: 1\r\nTo: ${cfg.mail||''}\r\nSubject: =?UTF-8?B?${utf8b64(pk.title)}?=\r\nMIME-Version: 1.0\r\nContent-Type: multipart/mixed; boundary="${bd}"\r\n\r\n`;
  o+=`--${bd}\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap76(utf8b64(pk.text))}`;
  const parts=[o];
  for(const f of files){
    const u8=new Uint8Array(await f.arrayBuffer());
    parts.push(`--${bd}\r\nContent-Type: ${f.type||'application/octet-stream'}; name="${f.name}"\r\nContent-Transfer-Encoding: base64\r\nContent-Disposition: attachment; filename="${f.name}"\r\n\r\n${wrap76(b64(u8))}`);
  }
  parts.push(`--${bd}--\r\n`);
  return new Blob(parts,{type:'message/rfc822'});
}
async function downloadEml(pk){
  try{

    const eml=await buildEml(pk);
    downloadBlob(eml,pk.pdf.name.replace(/\.pdf$/,'')+'.eml');
    toast('Taslak indirildi. İndirilen .eml dosyasına çift tıklayın: Outlook / Mail, raporlar ekli hâlde yeni e-posta olarak açılır; alıcıyı yazıp gönderin.',12000);
    pk.recs.forEach(r=>{r.sharedAt=Date.now();r.dirty=false;persist(r)});
  }catch(e){toast('Taslak oluşturulamadı: '+((e&&e.message)||e),6000)}
}
const blobToDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function exportDepos(recs){

    readyPack={recs,files:[f],exp:true,title:'Depo İnceleme verisi',text:`${recs.length} depo ekte. Uygulamada Menü › "Başka kullanıcıdan depo al" ile açın.`,label:'Depo dosyası ('+recs.length+' depo)',jsonFile:fj};
    renderDock();toast('Dosya hazır. Alttaki düğmeye dokunun.',5000);

async function importFiles(files){
  let added=0,updated=0,skipped=0,bad=0;
  for(const f of files){
    try{
      const d=JSON.parse(await f.text());
      if(!d||d.format!=='depo-inceleme'||!Array.isArray(d.recs))throw new Error('format');
      for(const r of d.recs){
        const old=records.get(r.id);
        if(old&&(old.updatedAt||0)>=(r.updatedAt||0)){skipped++;continue}
        const metas=[];
        for(const p of (r.photos||[])){
          if(!p.data)continue;
          const blob=await (await fetch(p.data)).blob();
          await dbPut('photo',{id:p.id,recId:r.id,blob});
          metas.push({id:p.id,sec:p.sec,n:p.n,...(p.off?{off:true}:{})});
        }
        const rec=norm({id:r.id,createdAt:r.createdAt||Date.now(),updatedAt:r.updatedAt||Date.now(),v:r.v||{},photos:metas,by:r.by||d.by||'Başka kullanıcı',sharedAt:Date.now(),dirty:false});
        records.set(rec.id,rec);await dbPut('rec',rec);
        old?updated++:added++;
      }
    }catch(e){bad++}
  }
  if(view==='list')renderList();
  toast((added||updated?`${added} yeni, ${updated} güncellenen depo alındı`:'Yeni depo eklenmedi')+(skipped?` · ${skipped} zaten güncel`:'')+(bad?` · ${bad} dosya okunamadı`:''),8000);
}
function mailFallback(pk){
  if(matchMedia('(pointer:fine)').matches){downloadEml(pk);downloadBlob(pk.pdf,pk.pdf.name);readyPack=null;renderDock();return}
  downloadBlob(pk.pdf,pk.pdf.name);setTimeout(()=>downloadBlob(pk.xl,pk.xl.name),600);
  const to=encodeURIComponent(cfg.mail||''),body=encodeURIComponent(pk.text+'\n\n(PDF ve Excel indirildi; e-postaya ekleyin.)');
  toast('Bu tarayıcıda dosya paylaşımı yok. PDF ve Excel indirildi, e-posta açılıyor.',6000);
  setTimeout(()=>{location.href=`mailto:${to}?subject=${encodeURIComponent(pk.title)}&body=${body}`},1400);
  readyPack=null;renderDock();
}
async function mailRecs(recs){

    readyPack=pk;renderDock();
    toast(pk.note||'Rapor hazır. Alttaki düğmeye dokunun.',pk.note?9000:5000);
  }catch(e){toast('Rapor oluşturulamadı: '+((e&&e.message)||e),6000)}
  finally{sending=false;const b2=$('send')||$('mailall');if(b2)b2.disabled=false}
}

/* ---------- Olaylar ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='new')return newRec();
  if(t.dataset.addvisit!==undefined)return openVisitSheet(null);
  if(t.dataset.vedit)return openVisitSheet(t.dataset.vedit);
  if(t.dataset.vstart)return startVisit(t.dataset.vstart);
  if(t.id==='openvisited')return openVisited();
  if(t.dataset.seg){visSeg=t.dataset.seg;$('topsheet').innerHTML=visitedHtml();return}
  if(t.id==='vsave'){
    const date=$('vdate').value,name=$('vname').value.trim(),note=$('vnote').value.trim();
    if(!date||!name)return toast('Tarih ve depo adı gerekli');
    if(editVisitId){const v=visits.find(x=>x.id===editVisitId);if(v){v.date=date;v.name=name;v.note=note}}
    else visits.push({id:uid(),date,name,note});
    saveVisits();closeSheet();renderList();return toast('Ziyaret kaydedildi')}
  if(t.id==='vdel'){
    if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Silmek için tekrar dokunun';return}
    visits=visits.filter(x=>x.id!==editVisitId);saveVisits();closeSheet();renderList();return}
  if(t.dataset.open){closeSheet();return renderForm(t.dataset.open)}
  if(t.id==='back'||t.id==='done'){await flush();if(view==='report'&&reportFrom&&records.has(reportFrom))return renderForm(reportFrom);return renderList()}
  if(t.dataset.tab){repTab=t.dataset.tab;return renderReport()}
  if(t.id==='opensel')return openSheet('view');
  if(t.id==='gear'){await flush();return openMenu()}
  if(t.id==='sheetbg'||t.id==='sheetbg2'){closeSheet();if(view==='report'){const y=window.scrollY;renderReport();window.scrollTo(0,y)}return}
  if(t.id==='sheetok'){
    if(!reportSel.size)return;
    const m=sheetMode,recs=selRecs();closeSheet();
    if(m==='mail')return mailRecs(recs);
    if(m==='export')return exportDepos(recs);
    if(view==='report'){const y=window.scrollY;renderReport();window.scrollTo(0,y)}return}
  if(t.id==='m_report'){closeSheet();openReport(allSorted().map(r=>r.id),null);return openSheet('view')}
  if(t.id==='m_mail'||t.id==='m_export'){
    closeSheet();reportPool=allSorted();reportSel=new Set(reportPool.map(r=>r.id));
    if(!reportPool.length)return toast('Henüz inceleme yok');
    return openSheet(t.id==='m_mail'?'mail':'export')}
  if(t.id==='m_import'){closeSheet();return $('impfile').click()}
  if(t.id==='m_settings'){closeSheet();return renderSettings()}
  if(t.dataset.sheetsel){const id=t.dataset.sheetsel;reportSel.has(id)?reportSel.delete(id):reportSel.add(id);return refreshSheet()}
  if(t.dataset.selall){reportSel=reportSel.size===reportPool.length?new Set():new Set(reportPool.map(r=>r.id));return refreshSheet()}
  if(t.dataset.phall!==undefined){const on=t.dataset.phall==='1';selRecs().forEach(r=>{r.photos.forEach(p=>{if(on)delete p.off;else p.off=true});r.dirty=true;persist(r)});const y=window.scrollY;renderReport();window.scrollTo(0,y);return}
  if(t.dataset.ptog){
    let rec=null,ph=null;for(const r of records.values()){const q=r.photos.find(x=>x.id===t.dataset.ptog);if(q){rec=r;ph=q;break}}
    if(!ph)return;if(ph.off)delete ph.off;else ph.off=true;rec.dirty=true;persist(rec);
    if(view==='report'){const y=window.scrollY;renderReport();window.scrollTo(0,y)}else if(cur)rerenderKeepScroll();return}
  if(t.id==='viewxl'){await flush();return openReport([cur.id],cur.id)}
  if(t.id==='viewall'||t.id==='mailall'){return openReport(allSorted().map(r=>r.id),null)}
  if(t.id==='dlxl'||t.id==='dlpdf'){if(!reportSel.size)return toast('Önce en az bir depo seçin');return downloadReport(selRecs(),t.id==='dlxl'?'xlsx':'pdf')}
  if(t.id==='mailsel'){if(!reportSel.size)return toast('Önce en az bir depo seçin');return mailRecs(selRecs())}
  if(t.dataset.addfloor&&cur){
    (cur.v.katlar=cur.v.katlar||[]).push({ad:'',dep:'',mez:''});
    $('floors').innerHTML=floorRowsHtml(cur);touch();
    const l=$('floors').querySelector('.fl:last-child input');if(l)l.focus();return}
  if(t.dataset.delfloor!==undefined&&cur){
    cur.v.katlar.splice(+t.dataset.delfloor,1);$('floors').innerHTML=floorRowsHtml(cur);$('floortot').textContent=floorTotalsText(cur);syncKat();touch();return}
  if(t.id==='cfgsave'){
    cfg.name=$('nm').value.trim();cfg.mail=$('mail').value.trim();cfg.photos=$('pho').checked;
    try{await dbPut('kv',cfg,'cfg');$('cfgmsg').textContent='Kaydedildi'}catch(x){$('cfgmsg').textContent='Kaydedilemedi'}return}
  if(t.id==='install'&&installEvt){installEvt.prompt();installEvt=null;return}
  if(t.id==='send'){await flush();return mailRecs([cur])}
  if(t.id==='shareready'){
    const pk=readyPack;if(!pk)return;
    try{await doShare(pk)}catch(x){
      if(x&&x.name==='AbortError')return;
      if(pk.exp){downloadBlob(pk.jsonFile,pk.jsonFile.name);toast('Paylaşım açılamadı; dosya indirildi. Karşı tarafa e-posta/Teams ile gönderin.',8000);return}
      toast('Paylaşım açılamadı ('+((x&&(x.name||x.message))||x)+'). PDF ve Excel telefona indirildi; e-postaya ekleyin.',9000);
      if(matchMedia('(pointer:fine)').matches){downloadEml(pk);return}
      downloadBlob(pk.pdf,pk.pdf.name);setTimeout(()=>downloadBlob(pk.xl,pk.xl.name),700);
      const to=encodeURIComponent(cfg.mail||'');setTimeout(()=>{location.href=`mailto:${to}?subject=${encodeURIComponent(pk.title)}&body=${encodeURIComponent(pk.text+'\n\n(PDF ve Excel indirildi; e-postaya ekleyin.)')}`},1800);
    }
    return}
  if(t.id==='dlready'){if(readyPack)downloadBlob(readyPack.xl,readyPack.xl.name);return}
  if(t.id==='dlexp'){if(readyPack)downloadBlob(readyPack.jsonFile,readyPack.jsonFile.name);return}
  if(t.id==='dlreadyeml'){if(readyPack)downloadEml(readyPack);return}
  if(t.id==='dlreadypdf'){if(readyPack)downloadBlob(readyPack.pdf,readyPack.pdf.name);return}
  if(t.id==='cancelready'){readyPack=null;return renderDock()}
  if(t.dataset.go){const el=$('s_'+t.dataset.go);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.parentElement&&t.parentElement.dataset&&t.parentElement.dataset.yn&&cur){
    const k=t.parentElement.dataset.yn,val=t.dataset.v;
    cur.v[k]=cur.v[k]===val?'':val;
    [...t.parentElement.children].forEach(b=>b.setAttribute('aria-pressed',String(cur.v[k]===b.dataset.v)));
    document.querySelectorAll(`[data-dep="${k}"]`).forEach(el=>el.hidden=cur.v[k]!=='Evet');
    updateProg();return touch();
  }
  if(t.dataset.psave)return savePhoto(t.dataset.psave);
  if(t.dataset.pdel)return delPhoto(t.dataset.pdel);
  if(t.id==='del'){
    if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Silmek için tekrar dokunun';return}
    const rec=cur;records.delete(rec.id);cur=null;
    if(visits.some(v=>v.recId===rec.id)){visits=visits.filter(v=>v.recId!==rec.id);saveVisits()}
    try{await dbDel('rec',rec.id);for(const p of rec.photos)await dbDel('photo',p.id)}catch(x){}
    renderList();toast('İnceleme silindi');
  }
});
document.addEventListener('change',e=>{
  const i=e.target;if(i.id==='impfile'&&i.files.length){importFiles([...i.files]);i.value='';return}
 if(i.dataset&&i.dataset.photo&&i.files.length){addPhotos(i.dataset.photo,[...i.files]);i.value=''}
});
document.addEventListener('input',e=>{
  const i=e.target;if(i.id==='vq'){listQ=i.value;const l=$('vlist');if(l)l.innerHTML=visitedListHtml();return}
  if(cur&&i.dataset&&i.dataset.fl){
    const row=i.closest('.fl'),idx=+row.dataset.i;cur.v.katlar[idx][i.dataset.fl]=i.value;
    $('floortot').textContent=floorTotalsText(cur);syncKat();touch();return}
  if(!cur||!i.dataset||!i.dataset.k)return;
  const k=i.dataset.k;cur.v[k]=i.value;
  const f=COUNTED.find(x=>x.k===k);
  if(f&&f.min!==undefined){const r=document.querySelector(`[data-rule="${k}"]`);if(r){const tmp=document.createElement('div');tmp.innerHTML=ruleHtml(f,i.value);r.replaceWith(tmp.firstChild)}}
  if(k==='ad')$('title').textContent=i.value||'Yeni inceleme';
  if(k==='konum'){const w=i.closest('.fld');let a=w.querySelector('.maplink');const ok=/^https?:\/\//i.test(i.value);
    if(ok&&!a){a=document.createElement('a');a.className='maplink';a.textContent='Haritada aç';a.target='_blank';a.rel='noopener';w.appendChild(a)}
    if(a){if(ok)a.href=i.value;else a.remove()}}
  updateProg();touch();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
window.addEventListener('pagehide',()=>{flush()});
function netState(){$('net').hidden=navigator.onLine}
window.addEventListener('online',netState);
window.addEventListener('offline',netState);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});

/* ---------- Başlangıç ---------- */
async function boot(){
  netState();
  try{
    const c=await dbGet('kv','cfg');if(c)cfg=Object.assign(cfg,c);
    const vv=await dbGet('kv','visits');if(Array.isArray(vv))visits=vv;
    (await dbAll('rec')).forEach(r=>records.set(r.id,norm(r)));
  }catch(e){toast('Yerel depolama açılamadı. Özel gezinme kapalı olmalı.',6000)}
  renderList();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator){
    const had=!!navigator.serviceWorker.controller;let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',async()=>{
      if(!had||reloaded)return;reloaded=true;
      try{await flush()}catch(e){}
      toast('Yeni sürüm yüklendi, yenileniyor…',1500);setTimeout(()=>location.reload(),900);
    });
    navigator.serviceWorker.register('sw.js').then(r=>{r.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{});
  }
}
boot();
</script>
